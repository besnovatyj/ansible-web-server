---
##########################################################
# PHP
##########################################################

php_version: 8.4 # Стабильная версия из "https://packages.ubuntu.com/" для "Ubuntu 24.04.3 (Noble Numbat)"

# --------------------------------------------------------
# PHP
# Проверка доступности пакетов. На сервере выполните:
# ```php
# apt update
# apt search php8.4
# ```
# --------------------------------------------------------

php_modules: [
  "php{{ php_version }}-fpm",
  "php{{ php_version }}-cli",
  "php{{ php_version }}-common", # Содержит calendar
  "php{{ php_version }}-mysqlnd",
  "php{{ php_version }}-mysql", # Содержит pdo_mysql
  "php{{ php_version }}-redis",
  "php{{ php_version }}-zip",
  "php{{ php_version }}-gd",
  "php{{ php_version }}-mbstring",
  "php{{ php_version }}-curl",
  "php{{ php_version }}-xml", # Содержит simplexml, dom
  "php{{ php_version }}-apcu", # Заметки: Версия 5.1.24; для кэширования; включить apcu.enable=1 в conf.d/apcu.ini
  "php{{ php_version }}-intl", # TODO проверить что работает (должны работать форматтеры Yii2)
  "php{{ php_version }}-bcmath",
  "php{{ php_version }}-fileinfo",
  "php{{ php_version }}-pdo",
  "php{{ php_version }}-opcache", # Включить opcache.enable=1 в conf.d/opcache.ini. Конфигурируйте для производительности.
  "php{{ php_version }}-exif",
  "php{{ php_version }}-imagick",
  "php{{ php_version }}-memcached",
  #  "php{{ php_version }}-pcntl" # Только CLI, в FPM не работает
]

##########################################################
# MYSQL
##########################################################

mysql_db_name: mysql_db_name
mysql_db_user: mysql_db_user
mysql_db_user_password: "{{ vault_mysql_db_user_password }}"
mysql_root_password: "{{ vault_mysql_root_password }}"

# Список host-значений в mysql.user, которые root@<host> НЕ удаляются при secure_installation.
# Всё остальное (включая '%' и FQDN сервера) удаляется.
keep_mysql_root_hosts:
  - localhost
  - 127.0.0.1

##########################################################
# CERTBOT
##########################################################

certbot_email: 'name@domain.zone'
