---
##########################################################
# `snake_case` для Ansible-переменных не просто конвенция, а практическое требование Jinja2 — `php-version` он трактует
# как `php` минус `version`.
##########################################################

##########################################################
# SSH-USERS
##########################################################

############### Общее
local_home_path: "{{ lookup('env', 'HOME') }}"
force_key_regen: false # true — принудительно регенерировать ключи (бэкапит существующие в той же директории)
ssh_known_hosts_path: "{{ local_home_path }}/.ssh/known_hosts"
ssh_key_type: "ed25519" # или "rsa" (только если не поддерживается ed25519, например, если версия OpenSSH ниже 6.5)
ssh_key_size: 0 # Для RSA указать `4096`. Для ed25519 длина фиксированная.
target_ssh_port: 22 # TODO - лучше потом поменять порт по умолчанию для SSH
# Все SSH-ключи (включая automation) защищены passphrase из vault. Ansible не
# умеет вводить passphrase сам, поэтому ключи разлочиваются один раз за сессию
# через ssh-agent: `make agent-up` спрашивает passphrase, agent держит
# разлоченные приватки; ansible-playbook видит сокет в SSH_AUTH_SOCK.
# См. project_ansible_ssh_agent_makefile.md в memory.
#
# Passphrase для emergency-ключа root (key_<domain>_emergency_root). Им Ansible
# НЕ подключается — только человек руками в аварийной ситуации (но через
# ssh-agent или ручной ввод).
emergency_key_passphrase: "{{ vault_ssh_key_passphrase | default('') }}"

############### Пути к ключам
local_ssh_keys_dir: "{{ local_home_path }}/.ssh/{{ domain_name }}" # Выделенный per-domain подкаталог в ~/.ssh (ext4 — Unix-права и chattr работают штатно; изолирует проектные ключи от личных, упрощает бэкап). Ранее было: "{{ playbook_dir }}/../secrets/ssh" — бинд-маунт docker-desktop в WSL2 не хранит права (всё 0777) и ssh-клиент отказывался от таких ключей.
# ssh_keys_dir: "{{ ansible_env.HOME }}/.ssh" # ansible_env — это facts целевого хоста, а не контроллера
# Соглашение об именах (как домены из domain_name):
#   приватный ключ пользователя:  {{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ имя }}
#   публичный:                    ...pub
# emergency-ключ root — отдельной парой, c суффиксом _emergency_root.
emergency_key_path: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_emergency_root"
emergency_pubkey_path: "{{ emergency_key_path }}.pub"

############### Куда копируем
# То же значение, что host_ip (main.yml) — единый источник правды, чтобы не
# дублировать выражение hostvars[groups['site'][0]]['ansible_host'].
# Отдельное семантическое имя: «хост, к которому Ansible подключается по SSH».
target_host: "{{ host_ip }}"

##########################################################
# «Доменоподобная» структура пользователей.
#
# ssh_automation_user — единственный аккаунт, под которым Ansible ходит на
# сервер ПОСЛЕ bootstrap (по ключу С passphrase, разлоченному в ssh-agent;
# sudo NOPASSWD). Должен присутствовать в server_users c type: automation.
#
# server_users — декларативный список ВСЕХ аккаунтов на сервере. У каждого
# свой SSH-ключ С passphrase (см. блок про ssh-agent выше).
#
# Поля:
#   name                     — имя UNIX-пользователя (и суффикс файла ключа)
#   type: automation|human   — про UNIX-АККАУНТ, не про SSH-ключ:
#                               automation = `!` (locked) пароль + sudo NOPASSWD
#                                            (Ansible не вводит sudo-пароль);
#                               human      = UNIX-пароль из vault для console/
#                                            recovery, sudo с паролем.
#   sudo: nopasswd|password  — режим sudo
#   groups                   — доп. группы (обычно [sudo])
#   key_passphrase_vault_key — имя vault-переменной с passphrase SSH-ключа
#                              (обязательно для ВСЕХ — и automation, и human)
#   unix_password_vault_key  — (только human) имя vault-переменной с UNIX-паролем
#
# Добавить человека = +1 блок здесь + пара vault-переменных в secrets.yml.
##########################################################
ssh_automation_user: ansible

server_users:
  - name: ansible
    type: automation          # locked UNIX-пароль, sudo NOPASSWD
    sudo: nopasswd
    groups: [sudo]
    key_passphrase_vault_key: vault_user_ansible_passphrase

  - name: bes
    type: human               # UNIX-пароль в /etc/shadow, sudo с паролем
    sudo: password
    groups: [sudo]
    unix_password_vault_key: vault_user_bes_password
    key_passphrase_vault_key: vault_user_bes_passphrase

  # Новый человек = +1 блок (как +1 домен) + vault_user_<name>_* в secrets.yml:
  # - name: ops
  #   type: human
  #   sudo: password
  #   groups: [sudo]
  #   unix_password_vault_key: vault_user_ops_password
  #   key_passphrase_vault_key: vault_user_ops_passphrase

# Приватный ключ, которым Ansible подключается после bootstrap (см. hosts.yml).
automation_key_path: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ ssh_automation_user }}"
