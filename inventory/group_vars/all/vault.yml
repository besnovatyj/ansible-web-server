---
##########################################################
# `snake_case` для Ansible-переменных не просто конвенция, а практическое требование Jinja2 — `php-version` он трактует
# как `php` минус `version`.
##########################################################

##########################################################
# Публичный маппинг vault-переменных
# Сами зашифрованные значения хранятся в group_vars/all/secrets.vault
##########################################################

# vault_ssh_key_passphrase уже маппится в ssh.yml

# РЕШЕНО (2026-07-19): этот файл — ЕДИНСТВЕННОЕ место маппинга vault_* →
# публичные имена. Реализована альтернатива из прежнего комментария: суффиксы
# `_from_vault` убраны, `webserver.yml` vault-переменные больше не трогает.
# Потребители (роли mysql, redis, app_secrets, release, data_transfer) читают
# публичные имена, объявленные здесь.

mysql_root_password: "{{ vault_mysql_root_password }}"
mysql_db_user_password: "{{ vault_mysql_db_user_password }}"
redis_password: "{{ vault_redis_password }}"
# HMAC-ключ ALTCHA. Потребитель — роль web-server/app_secrets →
# файл /run/secrets/ALTCHA_HMAC_KEY.
altcha_hmac_key: "{{ vault_altcha_hmac_key }}"
# Сначала пароль, потом копирование ключей, потом уже без пароля. Чтобы автоматизировать копирование ключей, нужен пароль.
# NB: 20-bootstrap-access.yml (единственный плейбук, ходящий по паролю root)
# и его assert'ы читают vault_root_password НАПРЯМУЮ (play-level vars);
# root_password — публичный алиас, сейчас потребителей не имеет.
root_password: "{{ vault_root_password }}"

# Пер-пользовательские vault-переменные (vault_user_<name>_password /
# vault_user_<name>_passphrase) НЕ маппятся здесь намеренно: server_users
# хранит их имена в unix_password_vault_key / key_passphrase_vault_key, а
# роли читают значение динамически через lookup('vars', <имя>). Добавление
# нового человека не требует правок этого файла.
