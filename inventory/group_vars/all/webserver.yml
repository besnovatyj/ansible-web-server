---
##########################################################
# `snake_case` для Ansible-переменных не просто конвенция, а практическое требование Jinja2 — `php-version` он трактует
# как `php` минус `version`.
##########################################################

##########################################################
# PHP
##########################################################

php_version: 8.4 # Стабильная версия из "https://packages.ubuntu.com/" для "Ubuntu 24.04.3 (Noble Numbat)"

# --------------------------------------------------------
# PHP
# Проверка доступности пакетов. На сервере выполните:
# ```php
# apt update
# apt search php8.4
# ```
# --------------------------------------------------------

php_modules: [
  "php{{ php_version }}-fpm",
  "php{{ php_version }}-cli",
  "php{{ php_version }}-common", # Содержит calendar
  "php{{ php_version }}-mysqlnd",
  "php{{ php_version }}-mysql", # Содержит pdo_mysql
  "php{{ php_version }}-redis",
  "php{{ php_version }}-zip",
  "php{{ php_version }}-gd",
  "php{{ php_version }}-mbstring",
  "php{{ php_version }}-curl",
  "php{{ php_version }}-xml", # Содержит simplexml, dom
  "php{{ php_version }}-apcu", # Заметки: Версия 5.1.24; для кэширования; включить apcu.enable=1 в conf.d/apcu.ini
  "php{{ php_version }}-intl", # TODO проверить что работает (должны работать форматтеры Yii2)
  "php{{ php_version }}-bcmath",
  "php{{ php_version }}-fileinfo",
  "php{{ php_version }}-pdo",
  "php{{ php_version }}-opcache", # Включить opcache.enable=1 в conf.d/opcache.ini. Конфигурируйте для производительности.
  "php{{ php_version }}-exif",
  "php{{ php_version }}-imagick",
  "php{{ php_version }}-memcached",
  #  "php{{ php_version }}-pcntl" # Только CLI, в FPM не работает
]

##########################################################
# MYSQL
##########################################################

mysql_db_name: mysql_db_name
mysql_db_user: mysql_db_user
mysql_db_user_password: "{{ vault_mysql_db_user_password }}"
mysql_root_password: "{{ vault_mysql_root_password }}"

##########################################################
# CERTBOT
##########################################################

certbot_email: 'name@domain.zone'

##########################################################
# NGINX SITES
##########################################################

nginx_sites:
  - name: frontend
    server_name: "{{ app_hosts.main }} www.{{ app_hosts.main }}"
    web_root: "{{ web_root }}/{{ domain_name }}/frontend/pub"
    client_max_body_size: 10M # На всякий случай, вдруг вложение к письму потом разрешим
    php_fpm: true
  - name: backend
    server_name: "{{ app_hosts.adm }}"
    web_root: "{{ web_root }}/{{ domain_name }}/backend/pub"
    client_max_body_size: 700M # Загружаем только в админке, здесь самый большой лимит
    php_fpm: true
  - name: static
    server_name: "{{ app_hosts.files }}"
    web_root: "{{ web_root }}/{{ domain_name }}/static"
    client_max_body_size: 1M # Просто ограничение, здесь нет PHP и скриптов, только отдаёт статику
    php_fpm: false

##########################################################
# YII2 QUEUE WORKERS (90-queue)
##########################################################

# Сколько systemd-воркеров yii-queue@N включить и запустить.
queue_workers_count: 2

# Ресурсный лимит RAM на ОДИН воркер. При превышении ядро OOM-killнет именно
# этот воркер, не трогая nginx/mysql/php-fpm. Подбирать под профиль задач.
queue_worker_memory_max: 256M

# Ресурсный лимит CPU на ОДИН воркер. 50% = половина одного ядра.
queue_worker_cpu_quota: 20%
