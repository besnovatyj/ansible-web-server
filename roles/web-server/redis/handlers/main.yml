---
- name: Start redis on boot
  become: true
  systemd:
    name: redis-server
    state: started
    enabled: yes

- name: Restart redis
  become: true
  systemd:
    name: redis-server
    state: restarted
    daemon_reload: yes   # перечитать unit-файлы (подхватить override.conf) перед рестартом
  timeout: 60
