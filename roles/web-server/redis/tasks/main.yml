---
- name: Ensure Redis is present
  become: true
  apt:
   name: redis-server
   state: present
   update_cache: yes
  register: apt_result
  until: apt_result is success
  retries: 5       # Попробовать 5 раз
  delay: 10        # Ждать 10 секунд между попытками
  notify: Start redis on boot

- name: Ensure Redis data directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: 0755

- name: Create a directory "/etc/redis/redis.conf.d", if it does not exist
  become: true
  ansible.builtin.file:
    path: /etc/redis/redis.conf.d
    state: directory
    owner: root
    group: root
    mode: 0755

# Наши настройки кладём отдельным drop-in файлом, дистрибутивный
# /etc/redis/redis.conf не перетираем — он остаётся за пакетом.
- name: Ensure Redis custom configuration (drop-in)
  become: true
  ansible.builtin.template:
    src: redis-custom.conf.j2
    dest: /etc/redis/redis.conf.d/ansible-custom.conf
    owner: root
    group: root
    mode: 0644
  notify: Restart redis

# Подключаем drop-in ПОСЛЕДНЕЙ строкой дистрибутивного конфига, чтобы наши
# значения перекрывали дефолты. Если apt upgrade подменит redis.conf —
# blockinfile допишет include обратно при следующем прогоне (self-healing).
- name: Include drop-in as the last line of /etc/redis/redis.conf
  become: true
  ansible.builtin.blockinfile:
    path: /etc/redis/redis.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    insertafter: EOF
    block: |
      include /etc/redis/redis.conf.d/ansible-custom.conf
  notify: Restart redis

- name: Create redis systemd override directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    mode: 0755
  notify: Restart redis

- name: Configure redis to log to journald
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis-server.service.d/override.conf
    content: |
      [Service]
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=redis
    mode: 0644
  notify: Restart redis
