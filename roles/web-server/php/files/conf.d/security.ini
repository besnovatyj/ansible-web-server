; Отключаем опасные функции.
; parse_ini_file НЕ отключаем: она не исполняет команды, лишь читает ini-файл, а
; чтение файлов и так доступно (file_get_contents/fopen/readfile не в списке) —
; защиты не давала, но роняла легитимный ini-парсинг (Info SystemMetricProvider).
disable_functions = system,exec,shell_exec,passthru,proc_open,popen,proc_close,curl_multi_exec,show_source,phpinfo

; Не раскрывать версию PHP в HTTP-заголовках
expose_php = Off

; Отключаем удалённые URL в file-функциях (RFI(remote file inclusion)-вектор)
allow_url_fopen = Off
allow_url_include = Off
