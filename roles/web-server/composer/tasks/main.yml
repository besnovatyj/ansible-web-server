---
# Composer из apt (в Ubuntu 24.04 noble — Composer 2.7), а не installer с
# getcomposer.org: обновления подхватит unattended-upgrades (fire-and-forget),
# не нужен отдельный механизм self-update. Нужен для release-роли
# (70-release: composer install на сервере). php-cli уже установлен ролью php.
- name: Ensure Composer is present
  become: true
  apt:
    name: "composer"
    state: present
    update_cache: yes
  register: apt_result
  until: apt_result is success
  retries: 5       # Попробовать 5 раз
  delay: 10        # Ждать 10 секунд между попытками
