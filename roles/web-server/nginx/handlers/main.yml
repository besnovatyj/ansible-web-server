---
- name: Ensure nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started # Проверяем, что nginx запущен
    enabled: yes   # и доступен

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    daemon_reload: yes

# Виртуальные хосты меняются без разрыва соединений: reload перечитывает конфиг, старые
# рабочие процессы дообслуживают свои запросы.
- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
