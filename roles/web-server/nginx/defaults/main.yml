---
##########################################################
# Значения по умолчанию для сайтов (nginx_sites в inventory)
##########################################################
# Сайт в inventory указывает только то, чем отличается; остальное — отсюда
# (tasks/sites.yml: nginx_site_defaults | combine(сайт)).
nginx_site_defaults:
  client_max_body_size: 1M   # глобально в nginx.conf тоже 1m, сайт поднимает при надобности
  fastcgi_timeout: 60s       # read/connect/send к php-fpm (только type: php)
  static_cache: 1y           # expires для картинок, шрифтов, css, js; null — без отдельного кэша
  cors_preflight: false      # 204 на OPTIONS (REST API)
  headers: {}
  csp_mode: "off"            # off | report-only | enforce; в кавычках: голое off YAML читает как false
  csp: {}

##########################################################
# Заголовки безопасности по умолчанию
##########################################################
# Отдаются всеми сайтами, всегда (add_header … always: и на 4xx/5xx). Сайт дополняет их своими
# `headers` и может убрать любой, указав значение null.
nginx_default_headers:
  # Не встраивать страницы сайта в чужие <iframe> (кликджекинг). Пока CSP в Report-Only, её
  # frame-ancestors ничего не запрещает — работает только этот заголовок.
  X-Frame-Options: SAMEORIGIN
  # Браузер не угадывает тип содержимого по самим данным (MIME sniffing).
  X-Content-Type-Options: nosniff

# HSTS: после первого HTTPS-ответа браузер ходит на домен только по HTTPS указанное время.
# Отдаётся только с 443 и только когда сертификат уже выпущен. Без includeSubDomains/preload:
# их потом не отменить быстро, а включать стоит лишь когда HTTPS проверен на всех поддоменах.
# Пустая строка — не отдавать.
nginx_hsts: "max-age=31536000"

##########################################################
# TLS
##########################################################
# Сертификат один на все сайты, lineage = домен (роль certbot, --cert-name {{ domain_name }}).
nginx_tls_cert_name: "{{ domain_name }}"

# Слушать IPv6 рядом с IPv4. Если у домена есть AAAA-запись, а nginx слушает только IPv4,
# устройства, предпочитающие IPv6 (iPhone в мобильной сети), получают отказ соединения,
# а с другого устройства «всё открывается».
# По умолчанию — если у сервера есть IPv6-адрес (факты Ansible): на сервере с выключенным
# в ядре IPv6 `listen [::]` не даст nginx запуститься. Можно задать явно в inventory.
nginx_listen_ipv6: "{{ (ansible_all_ipv6_addresses | default([])) | length > 0 }}"
