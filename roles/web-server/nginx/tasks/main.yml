---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes
  register: apt_result
  until: apt_result is success
  retries: 5       # Попробовать 5 раз
  delay: 10        # Ждать 10 секунд между попытками
  notify: Ensure nginx is started and enabled

- name: Настройка Nginx для низкой памяти
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    backup: yes
  notify: Restart nginx

# Создаём директорию для файла перезаписи настроек `systemd unit` для nginx
- name: Create nginx systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: 0755
  notify: Restart nginx

# Создаём файл, который перезапишет настройки юнита systemd для nginx, чтобы логи писались в systemd-journal
- name: Configure nginx to log to journald
  copy:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    content: |
      [Service]
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nginx
    mode: 0644
  notify: Restart nginx

# Виртуальные хосты (nginx_sites из inventory) + сервер по умолчанию + nginx -t.
# Отдельным файлом, потому что их же перерисовывает 80-certbot после выпуска сертификата
# (include_role … tasks_from: sites): появляется 443 и редирект с 80.
- name: Virtual hosts
  ansible.builtin.include_tasks: sites.yml

