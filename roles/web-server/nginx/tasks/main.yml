---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes
  register: apt_result
  until: apt_result is success
  retries: 5       # Попробовать 5 раз
  delay: 10        # Ждать 10 секунд между попытками
  notify: Ensure nginx is started and enabled

- name: Настройка Nginx для низкой памяти
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    backup: yes
  notify: Restart nginx

- name: Create web roots for all configured nginx sites
  ansible.builtin.file:
    path: "{{ item.web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy host settings
  ansible.builtin.template:
    src: site.tmp.j2
    dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    owner: root
    group: root
    mode: 0644
  notify: Restart nginx

- name: Create host available to enabled symbolic link
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain_name }}.conf"
    state: link
  notify: Restart nginx

# Создаём директорию для файла перезаписи настроек `systemd unit` для nginx
- name: Create nginx systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: 0755
  notify: Restart nginx

# Создаём файл, который перезапишет настройки юнита systemd для nginx, чтобы логи писались в systemd-journal
- name: Configure nginx to log to journald
  copy:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    content: |
      [Service]
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nginx
    mode: 0644
  notify: Restart nginx

# Перезагружаем конфигурацию systemd перед тестированием Nginx
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  check_mode: no
  changed_when: false
  notify: Restart nginx

