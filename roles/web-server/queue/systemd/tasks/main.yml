---
# Предусловие: сервер настроен и исходники проекта уже задеплоены
# (существует {{ web_root }}/{{ domain_name }}/yii и рабочий .env).
# Плейбук запускается вручную ПОСЛЕ деплоя и полностью настраивает очереди.

- name: Установить systemd-шаблон юнита Yii2 queue worker
  ansible.builtin.template:
    src: yii-queue@.service.j2
    dest: /etc/systemd/system/yii-queue@.service
    owner: root
    group: root
    mode: 0644
  notify: Restart yii-queue workers

- name: Включить и запустить queue-воркеров (yii-queue@1 .. yii-queue@N)
  ansible.builtin.systemd_service:
    name: "yii-queue@{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ range(1, queue_workers_count + 1) | list }}"
  loop_control:
    label: "yii-queue@{{ item }}"
