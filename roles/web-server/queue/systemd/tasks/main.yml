---
# Предусловие: сервер настроен и исходники проекта уже задеплоены ролью
# release (существует {{ web_root }}/{{ domain_name }}/yii); секреты приложения
# разложены в /run/secrets ролью app_secrets (60-webserver) — их читает
# SecretReader (рабочий .env приложению не нужен).
# Плейбук запускается вручную ПОСЛЕ 70-release и полностью настраивает очереди.

# Защита от тихого no-op: при queue_workers_count=0/undefined диапазон
# range(1, 1) пуст → воркеры молча НЕ создаются (и template, и handler).
# Лучше явно упасть, чем получить очередь без обработчиков.
- name: Assert queue_workers_count is valid (>= 1)
  ansible.builtin.assert:
    that:
      - queue_workers_count is defined
      - queue_workers_count | int >= 1
    fail_msg: >-
      queue_workers_count = {{ queue_workers_count | default('undefined') }}
      (нужно целое >= 1). Проверь inventory/group_vars/all/webserver.yml.

- name: Установить systemd-шаблон юнита Yii2 queue worker
  ansible.builtin.template:
    src: yii-queue@.service.j2
    dest: /etc/systemd/system/yii-queue@.service
    owner: root
    group: root
    mode: 0644
  notify: Restart yii-queue workers

- name: Включить и запустить queue-воркеров (yii-queue@1 .. yii-queue@N)
  ansible.builtin.systemd_service:
    name: "yii-queue@{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ range(1, queue_workers_count + 1) | list }}"
  loop_control:
    label: "yii-queue@{{ item }}"
