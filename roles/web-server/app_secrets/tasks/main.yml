---
# Раскладка секретов приложения в файлы под путь, который читает
# \Besnovatyj\Helpers\SecretReader (приоритет №1 — /run/secrets/{name}).
# Файловый путь выбран вместо ENV: (1) читается любым PHP-процессом под www-data
# (php-fpm + queue-воркеры) без прописывания EnvironmentFile в каждый юнит и без
# clear_env=no в пуле; (2) не утекает через /proc/<pid>/environ, phpinfo(),
# var_dump($_ENV). Значения — те же, что задают роли mysql/redis (единый источник).

# Быстрая проверка на сервере после прогона:
#  ls -l /run/secrets/                                # симлинк → /etc/bescms/secrets, внутри 4 файла
#  sudo -u www-data cat /run/secrets/MYSQL_PASSWORD   # www-data читает
#  systemctl reboot && ls -l /run/secrets             # симлинк жив после ребута

# Защита от тихого битого конфига: пустой секрет → SecretReader вернёт '' и
# приложение молча получит пустой пароль/имя БД. Лучше упасть здесь.
- name: Assert app secret values are present
  ansible.builtin.assert:
    that:
      - item.value | string | length > 0
    fail_msg: >-
      Пустой секрет '{{ item.key }}'. SecretReader вернёт '' и приложение молча
      получит битый конфиг БД/Redis. Проверь vault/webserver.yml.
  loop: "{{ app_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Создать персистентную директорию секретов
  ansible.builtin.file:
    path: "{{ app_secrets_dir }}"
    state: directory
    owner: root
    group: www-data
    mode: "0750"

# По файлу на секрет — так их читает SecretReader (одно имя = один файл).
# root:www-data 0640: пишет только root, читает www-data (php-fpm/воркеры).
# SecretReader делает trim(), завершающий \n не важен.
- name: Разложить секреты в отдельные файлы
  ansible.builtin.copy:
    dest: "{{ app_secrets_dir }}/{{ item.key }}"
    content: "{{ item.value }}"
    owner: root
    group: www-data
    mode: "0640"
  loop: "{{ app_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# --- Хосты приложения (MAIN_HOST/ADM_HOST/FILES_HOST) ---
# Тот же контракт «пустой → упасть здесь», что и у секретов: пустой хост →
# SecretReader вернёт '' → приложение получит битые абсолютные URL и cookieDomain.
- name: Assert app runtime hosts are present
  ansible.builtin.assert:
    that:
      - item.value | string | length > 0
    fail_msg: >-
      Пустой хост '{{ item.key }}'. SecretReader вернёт '' → битые абсолютные
      URL/cookieDomain. Проверь app_hosts в group_vars/all/main.yml.
  loop: "{{ app_runtime_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Хосты публичны — no_log НЕ ставим (в отличие от секретов выше): значения видно
# в логе, это упрощает диагностику и ничего не раскрывает. Пишем в тот же каталог
# и с теми же правами (root:www-data 0640), чтобы SecretReader нашёл их так же.
- name: Разложить хосты приложения в отдельные файлы (для SecretReader)
  ansible.builtin.copy:
    dest: "{{ app_secrets_dir }}/{{ item.key }}"
    content: "{{ item.value }}"
    owner: root
    group: www-data
    mode: "0640"
  loop: "{{ app_runtime_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# /run — tmpfs, symlink чистится на ребуте → держим его декларативно через
# systemd-tmpfiles (пересоздаётся на каждой загрузке). L+ = принудительно
# заменить существующий путь (идемпотентно между ребутами).
- name: "Symlink {{ app_secrets_runtime_link }} → {{ app_secrets_dir }} через tmpfiles (переживает ребут)"
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/bescms-secrets.conf
    content: "L+ {{ app_secrets_runtime_link }} - - - - {{ app_secrets_dir }}\n"
    owner: root
    group: root
    mode: "0644"

# Применяем немедленно, чтобы symlink появился в этом же прогоне (без ожидания
# ребута) — иначе php-fpm/воркеры не увидят /run/secrets до перезагрузки.
- name: Применить tmpfiles немедленно (создать symlink сейчас)
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/bescms-secrets.conf
  changed_when: false
