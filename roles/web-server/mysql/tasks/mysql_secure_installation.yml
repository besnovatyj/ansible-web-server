---
# python3-pymysql вместо python3-mysqldb: MySQL 8.4 LTS удалил плагин
# mysql_native_password, а MySQLdb пытается подключиться через него.
# pymysql нативно поддерживает caching_sha2_password. Если оба пакета
# установлены, community.mysql предпочтёт MySQLdb → удаляем его.
# TODO - кажется, я ам ставил раньше "python3-mysqldb", его не должно быть на чистой системе? Удалить блок удаления?
- name: Удаление python3-mysqldb (несовместим с MySQL 8.4 — нет mysql_native_password)
  apt:
    name: python3-mysqldb
    state: absent
  when: ansible_os_family == 'Debian'

- name: Установка python3-pymysql (необходим для модулей community.mysql)
  apt:
    name: python3-pymysql
    state: present
  when: ansible_os_family == 'Debian'

# Oracle-пакет MySQL 8.4 через debconf (см. install.yml) задаёт пароль root
# = mysql_root_password уже на первом запуске (caching_sha2_password, не auth_socket
# и не пустой пароль). Поэтому прежняя ветка «свежая установка = пустой пароль»
# больше не нужна: всегда подключаемся через unix-socket с известным паролем,
# задача идемпотентна (повторный прогон ничего не меняет).
#
# community.mysql.mysql_user в связке с MySQL 8.4 LTS ломается: модуль
# внутренне ссылается на удалённый плагин mysql_native_password при
# проверке/сравнении хешей пароля (ошибка 1524). Обходим через mysql_query:
# ALTER USER идемпотентен, GRANT ALL для root — тоже.
- name: Обеспечить пароль root@localhost (ALTER USER)
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "ALTER USER 'root'@'localhost' IDENTIFIED BY %(pwd)s"
    named_args:
      pwd: "{{ mysql_root_password }}"
  no_log: true
  changed_when: false

- name: Обеспечить привилегии root@localhost (GRANT ALL)
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION"
  no_log: true
  changed_when: false
