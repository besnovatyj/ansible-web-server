---
# community.mysql.mysql_db / mysql_user ломаются с MySQL 8.4 LTS:
# модуль внутренне ссылается на удалённый mysql_native_password.
# Обходим через mysql_query — все операции идемпотентны.
- name: Создать БД {{ mysql_db_name }}
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "CREATE DATABASE IF NOT EXISTS `{{ mysql_db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
  no_log: true
  changed_when: false

- name: Создать пользователя {{ mysql_db_user }}@localhost
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "CREATE USER IF NOT EXISTS '{{ mysql_db_user }}'@'localhost' IDENTIFIED BY %(pwd)s"
    named_args:
      pwd: "{{ mysql_db_user_password }}"
  no_log: true
  changed_when: false

- name: Обеспечить пароль {{ mysql_db_user }}@localhost
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "ALTER USER '{{ mysql_db_user }}'@'localhost' IDENTIFIED BY %(pwd)s"
    named_args:
      pwd: "{{ mysql_db_user_password }}"
  no_log: true
  changed_when: false

- name: Привилегии {{ mysql_db_user }}@localhost на {{ mysql_db_name }}
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "GRANT ALL PRIVILEGES ON `{{ mysql_db_name }}`.* TO '{{ mysql_db_user }}'@'localhost'"
  no_log: true
  changed_when: false

- name: Настройка MySQL для низкой памяти
  template:
    src: mysqld.cnf.j2
#    dest: /etc/mysql/my.cnf
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    owner: root
    group: root
    mode: 0644
    backup: yes
  notify: Restart mysql
