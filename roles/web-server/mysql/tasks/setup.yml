---
- name: Create a new database
  mysql_db:
    name: "{{ mysql_db_name }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true

- name: Add user
  mysql_user:
    host: localhost
    name: "{{ mysql_db_user }}"
    password: "{{ mysql_db_user_password }}"
    priv: '{{ mysql_db_name }}.*:ALL,GRANT'
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    plugin: caching_sha2_password  # MySQL 8.4: native_password убран; PHP 8.4 (mysqlnd) поддерживает caching_sha2
  no_log: yes

- name: Настройка MySQL для низкой памяти
  template:
    src: mysqld.cnf.j2
#    dest: /etc/mysql/my.cnf
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    owner: root
    group: root
    mode: 0644
    backup: yes
  notify: Restart mysql
