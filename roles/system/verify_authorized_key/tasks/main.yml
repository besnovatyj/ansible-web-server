##
# Косвенная проверка, что публичный ключ установлен в authorized_keys
# целевого пользователя на сервере + sshd разрешает ключ-вход.
#
# Зачем: прямой `ssh -i KEY user@server` в BatchMode НЕВОЗМОЖЕН для ключей
# с passphrase. По политике проекта passphrase ставится на ВСЕ ключи, кроме
# automation-user'a (Ansible им ходит, passphrase невозможен). То есть
# verify_ssh с реальным входом подходит ТОЛЬКО для automation; для всех
# остальных (root, human) — эта роль.
#
# Параметры:
#   verify_target_user (str)              — имя пользователя на сервере (root, bes, ...)
#   verify_local_pubkey (str)             — путь к локальному .pub-ключу для сверки
#   verify_target_is_root (bool=false)    — если true, проверяем PermitRootLogin
#   verify_permitroot_strict (bool=false) — если true И target=root, требуем
#                                          PermitRootLogin=prohibit-password
#                                          (строго, не yes). Включать в Stage-6
#                                          после hardening для защиты от
#                                          регрессии. В Stage-2 (до hardening)
#                                          оставлять false.
##
---
- name: "verify_authorized_key[{{ verify_target_user }}]: get local pubkey fingerprint"
  delegate_to: localhost
  become: false
  ansible.builtin.command: "ssh-keygen -lf {{ verify_local_pubkey }}"
  register: _vak_local_fpr
  changed_when: false

- name: "verify_authorized_key[{{ verify_target_user }}]: extract local SHA256"
  ansible.builtin.set_fact:
    _vak_local_sha: "{{ _vak_local_fpr.stdout | regex_search('SHA256:[^ ]+') }}"

- name: "verify_authorized_key[{{ verify_target_user }}]: resolve target home dir"
  ansible.builtin.getent:
    database: passwd
    key: "{{ verify_target_user }}"

- name: "verify_authorized_key[{{ verify_target_user }}]: set authorized_keys path"
  ansible.builtin.set_fact:
    _vak_authkeys_path: "{{ getent_passwd[verify_target_user][4] }}/.ssh/authorized_keys"

- name: "verify_authorized_key[{{ verify_target_user }}]: read server fingerprints"
  ansible.builtin.command: "ssh-keygen -lf {{ _vak_authkeys_path }}"
  register: _vak_server_fpr
  changed_when: false
  failed_when: false

# Проверки sshd-политики делаем в shell — Jinja-регулярки в assert получаются
# хрупкими, особенно для AllowUsers/DenyUsers (списки через пробел).
- name: "verify_authorized_key[{{ verify_target_user }}]: check sshd policy"
  ansible.builtin.shell: |
    set -e
    user="{{ verify_target_user }}"
    is_root="{{ 'yes' if verify_target_is_root | default(false) else 'no' }}"
    cfg=$(sshd -T 2>/dev/null)

    pubauth=$(echo "$cfg" | awk 'tolower($1)=="pubkeyauthentication"{print tolower($2); exit}')
    [ "$pubauth" = "yes" ] || { echo "FAIL:PubkeyAuthentication=$pubauth"; exit 1; }

    if [ "$is_root" = "yes" ]; then
      prl=$(echo "$cfg" | awk 'tolower($1)=="permitrootlogin"{print tolower($2); exit}')
      strict="{{ 'yes' if verify_permitroot_strict | default(false) else 'no' }}"
      if [ "$strict" = "yes" ]; then
        # После hardening (Stage-3 и далее): только prohibit-password.
        # without-password — устаревший синоним (до OpenSSH 7.0), sshd -T
        # может вернуть любой из двух в зависимости от версии/дистрибутива.
        # yes тоже разрешает ключ-вход, но допускает регрессию политики.
        case "$prl" in
          prohibit-password|without-password) ;;
          *) echo "FAIL:PermitRootLogin=$prl (strict mode expects prohibit-password)"; exit 1 ;;
        esac
      else
        case "$prl" in
          yes|prohibit-password|without-password) ;;
          *) echo "FAIL:PermitRootLogin=$prl"; exit 1 ;;
        esac
      fi
    fi

    allow=$(echo "$cfg" | awk 'tolower($1)=="allowusers"{$1=""; sub(/^ /,""); print; exit}')
    if [ -n "$allow" ]; then
      echo "$allow" | tr ' ' '\n' | grep -Fxq "$user" \
        || { echo "FAIL:AllowUsers=[$allow] does not contain $user"; exit 1; }
    fi

    deny=$(echo "$cfg" | awk 'tolower($1)=="denyusers"{$1=""; sub(/^ /,""); print; exit}')
    if [ -n "$deny" ]; then
      if echo "$deny" | tr ' ' '\n' | grep -Fxq "$user"; then
        echo "FAIL:DenyUsers=[$deny] contains $user"; exit 1
      fi
    fi

    echo OK
  register: _vak_sshd_policy
  changed_when: false
  failed_when: _vak_sshd_policy.stdout != 'OK'

- name: "verify_authorized_key[{{ verify_target_user }}]: assert pubkey installed in authorized_keys"
  ansible.builtin.assert:
    that:
      - _vak_local_sha | length > 0
      - _vak_local_sha in (_vak_server_fpr.stdout | default(''))
    fail_msg: |
      verify_authorized_key[{{ verify_target_user }}]: ключ НЕ найден.
      local pubkey fpr: {{ _vak_local_fpr.stdout }}
      server {{ _vak_authkeys_path }}:
      {{ _vak_server_fpr.stdout | default('(не удалось прочитать)') }}
    success_msg: >-
      pubkey ({{ _vak_local_sha }}) присутствует в {{ _vak_authkeys_path }};
      sshd разрешает {{ verify_target_user }} key-login.
