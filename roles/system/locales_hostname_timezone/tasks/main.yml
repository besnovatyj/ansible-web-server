---
- name: Set timezone
  timezone:
    name: "{{ time_zone }}"

- name: Install locales apt
  apt:
    name: locales
    state: present
    update_cache: yes

# Используем locale-gen напрямую, а не community.general.locale_gen: модуль на
# Ubuntu Server 24.04 отрабатывал десятки секунд и отдавал "ok", но `locale -a`
# оставался без целевых локалей. Прямой `locale-gen NAME ...` принимает имена
# аргументами и работает без оглядки на /etc/locale.gen — детерминированно.
- name: Get currently generated locales
  ansible.builtin.command: locale -a
  register: locale_avail_pre
  changed_when: false

- name: Generate required locales
  ansible.builtin.command:
    cmd: "locale-gen {{ locale1 }} {{ locale2 }}"
  when: >-
    (locale1.split('.')[0] not in locale_avail_pre.stdout)
    or
    (locale2.split('.')[0] not in locale_avail_pre.stdout)

- name: Verify locales actually generated
  ansible.builtin.shell: |
    set -e
    locale -a | grep -qi "^{{ locale1.split('.')[0] }}"
    locale -a | grep -qi "^{{ locale2.split('.')[0] }}"
  changed_when: false

# Системная локаль: LANG = locale2 (en_US.UTF-8) — консоль и логи системы на
# английском. locale1 (ru_RU.UTF-8) выше уже сгенерирована через locale_gen и
# доступна процессам, которые её явно запрашивают (напр. PHP setlocale).
# Локализация Yii2 (даты, числа, тексты) идёт через intl/ICU и конфиг приложения
# и от системной LANG НЕ зависит — поэтому русский LANG на ОС не нужен.
# ПРЕЖНЯЯ команда была сломана: `LANG=.. LC_TIME=..` — это голые присваивания
# переменных (никуда не экспортируются), а `update-locale` вызывался БЕЗ
# аргументов → /etc/default/locale не менялся, локаль фактически не ставилась.
- name: Set system locale (LANG=locale2; ru_RU generated above for the app)
  ansible.builtin.command:
    cmd: "update-locale LANG={{ locale2 }}"
  changed_when: true

- name: Set hostname
  shell:
    cmd: "hostnamectl set-hostname {{ domain_name }}"
