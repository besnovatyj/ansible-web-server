##
#
# Генерация SSH-ключей для ВСЕХ аккаунтов (server_users) + emergency root.
#
# 1. Проверяется существование директории для ключей.
# 2. Получается текущая дата/время для именования бэкапов.
# 3. Для каждого пользователя из server_users генерируется своя пара ключей
#    (см. keypair.yml). passphrase:
#      - automation → "" (Ansible ходит этим ключом — passphrase недопустим);
#      - human      → значение vault-переменной из key_passphrase_vault_key.
# 4. Отдельно генерируется аварийная пара для root (passphrase из vault).
# 5. На одну пару логика не изменилась (проверка наличия → бэкап при
#    force_key_regen → генерация) и вынесена в keypair.yml.
#
# NB: раньше роль хардкодила две пары (ordinary + emergency). Теперь количество
# пар = len(server_users) + 1.
##
---

- name: Ensure SSH keys directory exists locally
  file:
    path: "{{ local_ssh_keys_dir }}"
    state: directory
    mode: '0700'  # Безопасные права для директории

#    TODO Если нижний вариант заработает, то закомментированный можно будет удалить (В закомментированном значение извлекается так - current_datetime.stdout).
# - name: Get current datetime for backups if force_key_regen is true
#   command: date +%Y-%m-%d_%H-%M-%S
#   register: current_datetime
#   changed_when: false
#   when: force_key_regen | bool
- name: Set current datetime for backups (ГГГГ-ММ-ДД_ЧЧ-ММ-СС)
  set_fact:
    current_datetime: "{{ ansible_date_time.iso8601 | regex_replace(':', '-') | regex_replace('T', '_') | regex_replace('\\..*', '') }}"
  when: force_key_regen | bool

# Пара ключей на каждого пользователя из server_users.
- name: Generate keypair per server user
  include_tasks: keypair.yml
  loop: "{{ server_users }}"
  loop_control:
    loop_var: su
    label: "{{ su.name }} ({{ su.type }})"
  vars:
    kp_label: "{{ su.name }} ({{ su.type }})"
    kp_path: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ su.name }}"
    # automation → без passphrase; human → passphrase из его vault-переменной.
    kp_passphrase: "{{ ssh_key_passphrase if su.type == 'automation' else lookup('vars', su.key_passphrase_vault_key) }}"

# Аварийная пара ключей для root (passphrase из vault; Ansible ею не ходит).
- name: Generate emergency root keypair
  include_tasks: keypair.yml
  vars:
    kp_label: "emergency root"
    kp_path: "{{ emergency_key_path }}"
    kp_passphrase: "{{ emergency_key_passphrase }}"
