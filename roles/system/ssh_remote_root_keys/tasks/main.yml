---
##
# DEPRECATED (2026-05-15): emergency-ключ root теперь раскладывает роль
# `ssh_push_keys` (stage-1b-bootstrap-keys.yml). Роль больше не подключается,
# оставлена как история. Можешь удалить каталог после проверки нового pipeline.
##
- name: Ensure .ssh directory exists for target user
  file:
    path: "/root/.ssh"
    state: directory
    mode: '0700'
    owner: "root"
    group: "root"

- name: Copy public key to root (for emergency access)
  authorized_key:
    user: root
    key: "{{ lookup('file', emergency_pubkey_path) }}"
    state: present
    manage_dir: yes
