##
# Реальный SSH-вход как `verify_ssh_user` на сервер указанным ключом.
# Используется для всех типов аккаунтов — automation, human, emergency root.
#
# Для ключей с passphrase passphrase разлочен заранее в ssh-agent через
# `make agent-up` (см. роль ssh_agent_check, которая делает pre-flight
# для текущего плейбука). Клиент с IdentitiesOnly=yes + -i KEY:
#   - находит соответствующий fingerprint в агенте → агент даёт подпись;
#   - иначе читает приватник из файла напрямую (passphrase нет → ок).
#
# Параметры:
#   verify_ssh_user (str)  — имя пользователя на сервере
#   verify_ssh_key  (str)  — путь к приватному ключу (или .pub — оба валидны
#                            при наличии ключа в агенте; ssh использует -i
#                            для матчинга по fingerprint)
##
---
- name: "verify_ssh: SSH login {{ verify_ssh_user }}@{{ target_host }}"
  delegate_to: localhost
  # become: false — иначе при include из play с `become: true` Ansible пытается
  # sudo НА ЛОКАЛЬНОЙ машине (а у bes-home нет NOPASSWD) → "sudo: a password
  # is required". Для локального запуска ssh root не нужен.
  become: false
  # SSH_AUTH_SOCK явно прокидываем в окружение команды. Технически subprocess
  # унаследовал бы его от ansible-playbook, но явная зависимость от агента
  # делает роль самодокументируемой и устойчивой к будущим перетасовкам env.
  environment:
    SSH_AUTH_SOCK: "{{ lookup('env', 'SSH_AUTH_SOCK') }}"
  ansible.builtin.command:
    argv:
      - ssh
      # IdentitiesOnly=yes — клиент предлагает серверу ТОЛЬКО ключ из -i.
      # Без этого с агентом, заряженным несколькими ключами, нарывались на
      # MaxAuthTries (server default=6) до того, как очередь дойдёт до -i.
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - ConnectTimeout=10
      - -i
      - "{{ verify_ssh_key }}"
      - -p
      - "{{ target_ssh_port }}"
      - "{{ verify_ssh_user }}@{{ target_host }}"
      - "echo OK"
  register: verify_ssh_result
  changed_when: false
  failed_when: "'OK' not in verify_ssh_result.stdout"

- name: "verify_ssh: assert login succeeded for {{ verify_ssh_user }}"
  ansible.builtin.assert:
    that:
      - verify_ssh_result.rc == 0
    fail_msg: "SSH login as {{ verify_ssh_user }} via {{ verify_ssh_key }} FAILED!"
    success_msg: "SSH login as {{ verify_ssh_user }} OK"
