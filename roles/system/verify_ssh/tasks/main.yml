---
- name: "verify_ssh: SSH login {{ verify_ssh_user }}@{{ target_host }}"
  delegate_to: localhost
  # become: false — иначе при include из play с `become: true` Ansible пытается
  # sudo НА ЛОКАЛЬНОЙ машине (а у bes-home нет NOPASSWD) → "sudo: a password
  # is required". Для локального запуска ssh root не нужен.
  become: false
  # IdentitiesOnly=yes + IdentityAgent=none — критично: без них ssh-клиент
  # на контроллере сначала предлагает все ключи из ssh-agent и ~/.ssh/config,
  # упирается в MaxAuthTries (default=6) и до нашего -i ключа не доходит →
  # Permission denied, хотя ключ на сервере корректный. Особенно бьёт по
  # verify root по emergency-ключу, когда в агенте лежат другие ключи
  # домена. С этими опциями клиент предложит ТОЛЬКО указанный -i.
  command: >
    ssh -i {{ verify_ssh_key }}
        -o IdentitiesOnly=yes
        -o IdentityAgent=none
        -o BatchMode=yes
        -o StrictHostKeyChecking=yes
        -o ConnectTimeout=10
        -p {{ target_ssh_port }}
        {{ verify_ssh_user }}@{{ target_host }} "echo OK"
  register: verify_ssh_result
  changed_when: false
  failed_when: "'OK' not in verify_ssh_result.stdout"

- name: "verify_ssh: assert login succeeded for {{ verify_ssh_user }}"
  assert:
    that:
      - verify_ssh_result.rc == 0
    fail_msg: "SSH login as {{ verify_ssh_user }} via {{ verify_ssh_key }} FAILED!"
    success_msg: "SSH login as {{ verify_ssh_user }} OK"
