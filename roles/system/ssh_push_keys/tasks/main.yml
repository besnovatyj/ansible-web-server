##
# Доставка публичных ключей на сервер.
#
# Запускается из stage-1b-bootstrap-keys.yml под root.
#
# - Каждому пользователю из server_users — его публичный ключ
#   (key_<domain>_<name>.pub) в ~/.ssh/authorized_keys.
# - automation-ключ помечается опцией `restrict` (см. 000-ANALYSIS.md §7):
#   нет pty/agent/X11/port-forwarding — automation-сессии это не нужно,
#   а площадь злоупотребления украденным (без passphrase) ключом сужается.
# - human-ключам restrict НЕ ставим (нужен интерактивный pty).
# - emergency-ключ root — в /root/.ssh/authorized_keys (аварийный доступ).
##
---

- name: Ensure .ssh directory exists for each user
  ansible.builtin.file:
    path: "/home/{{ su.name }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ su.name }}"
    group: "{{ su.name }}"
  loop: "{{ server_users }}"
  loop_control:
    loop_var: su
    label: "{{ su.name }}"

- name: Deploy public key to each user
  authorized_key:
    user: "{{ su.name }}"
    key: "{{ lookup('file', local_ssh_keys_dir + '/key_' + domain_name + '_' + su.name + '.pub') }}"
    state: present
    manage_dir: true
    # restrict только для automation; human получает ключ без ограничений (нужен pty).
    key_options: "{{ 'restrict' if su.type == 'automation' else omit }}"
  loop: "{{ server_users }}"
  loop_control:
    loop_var: su
    label: "{{ su.name }} ({{ su.type }})"

- name: Ensure .ssh directory exists for root
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Deploy emergency public key to root
  authorized_key:
    user: root
    key: "{{ lookup('file', emergency_pubkey_path) }}"
    state: present
    manage_dir: true
