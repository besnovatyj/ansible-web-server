---
# Ждём освобождения dpkg/apt-lock ДО apt-операций (а не только перед reboot).
# Это гонка с apt-daily.timer / unattended-upgrades: фоновый таймер может
# держать lock к моменту запуска плейбука. Модуль apt со своим lock_timeout
# в теории должен ждать, но на практике поведение зависит от версии Ansible
# и от того, какой именно lock держит конкурент (lock-frontend / lock /
# lists/lock). Явное ожидание здесь = детерминированное поведение и понятная
# ошибка вместо тихого зависания apt.
# become: true обязателен — без sudo fuser не видит процессы под root и
# мог давать ложное «lock свободен», пока apt-daily реально его держит.
- name: Wait for system apt locks to be released (bounded, pre-apt)
  become: true
  ansible.builtin.command:
    cmd: timeout 300 bash -c 'while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 5; done'
  register: dpkg_lock_wait_pre
  changed_when: false
  failed_when: dpkg_lock_wait_pre.rc != 0

- name: Update APT package cache
  become: true
  apt:
    update_cache: yes # обновляет кэш APT (список доступных пакетов)
    cache_valid_time: 86400  # One day (кэш обновляется, только если он старше 24 часов (идемпотентность))
    lock_timeout: 300  # ждать dpkg/apt-lock до 5 мин (гонка с unattended-upgrades/apt-daily.timer), затем чёткая ошибка

# Главная причина «нулевой активности» на Ubuntu 22.04/24.04 — это needrestart,
# который запускается ПОСЛЕ установки пакетов и через whiptail UI спрашивает,
# какие демоны перезапустить. В неинтерактивной сессии без NEEDRESTART_MODE=a
# и NEEDRESTART_SUSPEND=1 он молча висит, пока кто-то не нажмёт Enter.
# DEBIAN_FRONTEND / DEBIAN_PRIORITY этого НЕ покрывают.
#
# dpkg_options=force-confdef,force-confold — автоответ на conffile-prompts
# (иначе dpkg может остановиться на вопросе «использовать новую версию
# /etc/...» при апгрейде пакетов с изменёнными conffiles).
# force_apt_get=true — детерминированно используем apt-get, а не aptitude
# (aptitude может быть не установлен, или вести себя иначе).
# async/poll — жёсткий таймаут на ВЕСЬ таск: при истинном зависании Ansible
# вернёт failed через 30 минут, а не повесит плейбук навсегда. Это страховка
# на случай, если какой-то ещё постустановочный хук решит интерактивно
# что-то спросить — мы хотя бы узнаем об этом и не потеряем сутки.
- name: Install security updates only
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
    DEBIAN_PRIORITY: critical
    NEEDRESTART_MODE: a       # 'a' = автоматически перезапустить сервисы, без whiptail
    NEEDRESTART_SUSPEND: '1'  # двойной пояс: совсем выключить needrestart на время apt
  apt:
    upgrade: safe  # Безопасное обновление, не удаляет пакеты (выполняет обновление установленных пакетов без удаления или установки новых зависимостей (аналог apt upgrade, а не apt full-upgrade).)
    only_upgrade: true  # Только обновление установленных пакетов (обновляет только уже установленные пакеты, не добавляя новых.)
    default_release: "{{ ansible_distribution_release }}-security"  # Только security-репозиторий (ограничивает обновления только пакетами из security-репозитория Ubuntu (например, noble-security для Ubuntu 24.04). Это минимизирует изменения, так как применяются только патчи безопасности. `{{ ansible_distribution_release }}` - факт ансибл, указывать вручную не нужно)
    lock_timeout: 300  # см. комментарий выше
    force_apt_get: true  # детерминированно apt-get вместо aptitude
    dpkg_options: 'force-confdef,force-confold'  # автоответ dpkg на вопрос о conffiles
  register: apt_update_result # для отладки, если нужно проверить, какие пакеты обновились.
  async: 1800  # макс. 30 мин на весь таск — спасает от любого нового интерактива/хук-зависания
  poll: 15     # опрашивать статус раз в 15 сек

# Перед reboot убеждаемся, что dpkg не в середине операции (иначе ребут
# посреди установки пакета). Раньше это был БЕЗУСЛОВНЫЙ цикл без таймаута →
# вечный hang при удержании lock. Теперь — ограничен 5 минутами, при
# превышении стадия падает с понятным сообщением (перезапустить позже),
# а не виснет и не ребутит сервер во время операции apt.
- name: Wait for system apt locks to be released (bounded)
  become: true
  ansible.builtin.command:
    cmd: timeout 300 bash -c 'while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done'
  register: dpkg_lock_wait
  changed_when: false
  failed_when: dpkg_lock_wait.rc != 0

- name: Check if reboot is required
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot server if needed
  become: true
  ansible.builtin.reboot:
    # Не время ожидания по умолчанию, а максимальное время ожидания, Ansible периодически пингует сервер.
    # Модуль ansible.builtin.reboot после команды reboot в цикле опрашивает хост и выполняет test_command
    # (по умолчанию whoami), и возвращается сразу, как только сервер ответил.
    reboot_timeout: 900
    post_reboot_delay: 15 # (по умолчанию 0) пауза перед попытками подключения — сеть/sshd успевают подняться
  when: reboot_required.stat.exists

# WORKAROUND Ansible #79992: модуль reboot после перезагрузки зацикливается на
# протухшем persistent SSH-мастере (ControlPersist) и сам не переподключается.
# Принудительно сбрасываем кэш соединения, чтобы последующие роли stage-1
# (locales/swap/systemd) шли по свежему сокету, а не ждали истечения ControlPersist.
# meta: reset_connection НЕ поддерживает when — ставим безусловно: при пропущенном
# ребуте это дешёвый сброс здорового соединения (переустановится на следующем таске).
- name: Reset SSH connection after potential reboot (Ansible #79992)
  meta: reset_connection

