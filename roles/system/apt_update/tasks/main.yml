---
# Гасим источник гонки за dpkg-локом в самом начале.
# На свежем сервере фоновые apt-daily.timer / unattended-upgrades могут держать
# lock-frontend в момент запуска плейбука. Останавливаем и таймеры (чтобы не
# перезапустили службу посреди нашей работы), и сами службы.
# Модуль systemd вместо shell по конвенции проекта. failed_when: false —
# это best-effort: на минимальном образе какого-то юнита может не быть, и это
# не повод падать. После reboot службы поднимутся сами — их состояние по
# умолчанию мы не трогаем (в проде unattended-upgrades нужен включённым).
- name: Stop background APT services and timers (kill lock races at the source)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
    - unattended-upgrades.service
  failed_when: false

# Дешёвая страховка от "No such file or directory" на урезанных образах.
# Обычно apt создаёт partial/ сам, но каталог ничего не стоит гарантировать.
- name: Ensure APT lists directory structure exists
  become: true
  ansible.builtin.file:
    path: /var/lib/apt/lists/partial
    state: directory
    mode: '0755'

# Обновление кэша APT.
# force_apt_get: true — КЛЮЧЕВОЕ. Без него модуль идёт через python-apt, который
# на слабом vCPU перестраивает бинарный кэш (/var/cache/apt/*.bin) с нуля и
# упирается в CPU на несколько минут (одно ядро в 100%), из-за чего плейбук
# «зависал». Ветка apt-get этого не делает и отрабатывает за ~20 секунд.
# lock_timeout: 300 — честное ожидание fcntl-лока dpkg силами самого apt-get
# (-o DPkg::Lock::Timeout=300): добирает остаточные in-flight операции
# (например, apt от cloud-init), которые мог не покрыть systemctl stop выше.
# async/poll — жёсткий потолок: если операция всё же зависнет, роль упадёт
# через 10 минут с ошибкой, а не повиснет навсегда.
- name: Update APT package cache
  become: true
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 86400   # идемпотентность: не обновлять кэш свежее суток
    force_apt_get: true
    lock_timeout: 300
  async: 600
  poll: 5

# Безопасный апгрейд уже установленных пакетов (upgrade: safe = apt upgrade,
# без удаления пакетов и без full-upgrade). only_upgrade: не тянуть новые пакеты.
# ВНИМАНИЕ про security-only: ограничить апгрейд одним security-pocket через
# default_release: "<release>-security" НЕЛЬЗЯ — в deb822 (ubuntu.sources) это
# не отдельный релиз, а suite внутри общего источника, и apt отвергает такое
# значение APT::Default-Release ("... is not available in the sources").
# Поэтому апгрейд идёт по всем подключённым репозиториям; на свежесозданном
# сервере это и есть ожидаемое «догнать пакеты до актуальных».
# environment (needrestart/DEBIAN_FRONTEND) — главный источник «тихого зависания»
# на Ubuntu 22.04/24.04: needrestart после установки пакетов через whiptail
# спрашивает, какие демоны перезапустить, и в неинтерактивной сессии молча ждёт
# Enter. NEEDRESTART_MODE=a + NEEDRESTART_SUSPEND=1 полностью его глушат;
# DEBIAN_FRONTEND=noninteractive этого НЕ покрывает.
# dpkg_options force-confdef,force-confold — автоответ на conffile-промпты,
# иначе dpkg может встать на вопросе о перезаписи /etc/*.
# force_apt_get: детерминированно apt-get, а не aptitude (которого может не быть).
# async 1800/poll 15 — потолок 30 мин на весь апгрейд; poll>0 значит Ansible
# ждёт завершения синхронно, поэтому дальше dpkg уже точно свободен.
- name: Upgrade installed packages (safe)
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
    DEBIAN_PRIORITY: critical
    NEEDRESTART_MODE: a
    NEEDRESTART_SUSPEND: '1'
  ansible.builtin.apt:
    upgrade: safe
    only_upgrade: true
    force_apt_get: true
    dpkg_options: 'force-confdef,force-confold'
    lock_timeout: 300
  register: apt_update_result
  async: 1800
  poll: 15

# Перезагрузка только если пакеты её потребовали (ядро/libc и т.п.).
# Отдельного ожидания лока перед reboot не нужно: apt-таск выше синхронный
# (poll>0) и вернулся только после завершения dpkg, а фоновые службы мы
# остановили в самом начале — грабить лок больше некому.
- name: Check if reboot is required
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot server if needed
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 900
    post_reboot_delay: 15   # даём sshd/сети подняться перед реконнектом
  when: reboot_required.stat.exists

# WORKAROUND Ansible #79992: после reboot модуль может зациклиться на протухшем
# SSH-соединении. Принудительно сбрасываем его, чтобы следующие роли шли по
# свежему сокету. meta нельзя ставить под when — при пропущенном ребуте это
# просто дешёвый сброс здорового соединения.
- name: Reset SSH connection after potential reboot (Ansible #79992)
  ansible.builtin.meta: reset_connection
