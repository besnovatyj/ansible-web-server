---
- name: Configure systemd journald log limits
  become: true
  lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^SystemMaxUse=', line: 'SystemMaxUse=100M' }
    - { regexp: '^RuntimeMaxUse=', line: 'RuntimeMaxUse=50M' }
  notify: Restart journald
