---
# Лимиты journald задаются drop-in'ом в journald.conf.d/ (рекомендованный
# systemd способ): основной /etc/systemd/journald.conf не трогаем, размеры —
# из переменных (см. defaults/main.yml).
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Configure systemd journald log limits (drop-in)
  ansible.builtin.template:
    src: journald-limits.conf.j2
    dest: /etc/systemd/journald.conf.d/10-ansible-limits.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald
