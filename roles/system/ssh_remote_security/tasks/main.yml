---
########################################################################
# SSH hardening через drop-in.
#
# Почему drop-in, а не правка /etc/ssh/sshd_config через lineinfile:
#   sshd читает директивы в порядке появления, ПЕРВАЯ совпавшая выигрывает
#   (в отличие от nginx/php-fpm). В /etc/ssh/sshd_config почти первой строкой
#   стоит `Include /etc/ssh/sshd_config.d/*.conf`, то есть файлы из drop-in
#   директории читаются РАНЬШЕ тела основного конфига. Поэтому cloud-init,
#   создающий /etc/ssh/sshd_config.d/50-cloud-init.conf с
#   `PasswordAuthentication yes` при первой инициализации VM, перебивает
#   любые правки в /etc/ssh/sshd_config.
#
# Решение:
#   1) Удаляем /etc/ssh/sshd_config.d/50-cloud-init.conf (cloud-init на уже
#      инициализированной системе свои файлы не перезаписывает).
#   2) Кладём собственный drop-in /etc/ssh/sshd_config.d/00-hardening.conf —
#      префикс 00- гарантирует, что он будет прочитан первым из всех файлов
#      директории. Первая директива выигрывает → наши значения применяются.
#
# Плюсы по сравнению со старой схемой с lineinfile:
#   - не зависим от регэкспов и порядка строк в /etc/ssh/sshd_config;
#   - переживает `apt upgrade openssh-server` (dpkg трогает основной файл,
#     drop-in остаётся нашим);
#   - идемпотентно (copy с фиксированным content);
#   - одно место правды.
########################################################################

# cloud-init создаёт этот файл при первом запуске VM, чтобы пользователю
# не отрезали парольный доступ ДО того, как он положит свой ssh-ключ.
# После hardening нам он только мешает — там жёстко `PasswordAuthentication yes`.
- name: Remove cloud-init SSH drop-in (overrides hardening)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart SSH

- name: Deploy SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
    # validate здесь не указываем: ansible требует `%s` (путь к temp-файлу),
    # а `sshd -t -f <drop-in>` упадёт на отсутствии HostKey — drop-in не
    # самостоятельный конфиг. Полная проверка делается следующим таском
    # `Validate final sshd config` через обычный `sshd -t` уже по итоговому
    # конфигу (включая Include). Если он упадёт — handler `Restart SSH`
    # не выполнится, sshd продолжит работать со старым конфигом.
    content: |
      # Managed by Ansible role: ssh_remote_security. Не редактировать вручную.
      # sshd: первая встретившаяся директива выигрывает; префикс 00- => этот
      # файл читается раньше всех остальных в /etc/ssh/sshd_config.d/.

      # --- Аутентификация ---
      # Запрещает вход по паролю для всех пользователей. Вход только по ключам.
      PasswordAuthentication no
      # Для 2FA (Google Authenticator) или расширенного PAM. Если поставить
      # PasswordAuthentication=no, но оставить KbdInteractiveAuthentication=yes,
      # всё равно можно войти по паролю — PAM запросит его через «интерактивный»
      # интерфейс. Поэтому выключаем оба.
      KbdInteractiveAuthentication no
      # Устаревший синоним KbdInteractiveAuthentication, выключаем для совместимости
      # со старыми клиентами/прокси, которые могут его проверять отдельно.
      ChallengeResponseAuthentication no
      # Включает вход по ключам.
      PubkeyAuthentication yes
      # Запрещает вход под root по SSH с помощью пароля. Оставляет возможность
      # входа только по ключу (нужно для emergency_root_key).
      PermitRootLogin prohibit-password

      # --- Безопасность и логи ---
      # Подробная информация о каждом SSH-соединении: аутентификация,
      # криптографические алгоритмы, начало/окончание сессий.
      LogLevel VERBOSE

      # --- Криптография (Ciphers / MACs / Kex / HostKey) ---
      Ciphers aes256-ctr,chacha20-poly1305@openssh.com
      MACs hmac-sha2-512,hmac-sha2-256
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
      HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

      # --- Тайм-ауты ---
      # Тайм-аут разрыва зависшей сессии: 300 сек × 3 = 15 минут.
      # Сервер каждые ClientAliveInterval отправляет «пинг» клиенту; если за
      # ClientAliveCountMax попыток нет ответа — соединение разрывается.
      ClientAliveInterval 300
      ClientAliveCountMax 3
  notify: Restart SSH

- name: Validate final sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
