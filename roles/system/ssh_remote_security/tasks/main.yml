---
- name: Backup SSH configuration
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.bak
    remote_src: yes
    mode: '0600'

# LogLevel VERBOSE в OpenSSH записывает подробную информацию о каждом SSH-соединении, включая аутентификацию, используемые криптографические алгоритмы и начало/окончание сессий.
- name: Enable verbose SSH logging
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LogLevel'
    line: 'LogLevel VERBOSE'
    state: present
  notify: Restart SSH

# Запрещает вход под root по SSH с помощью пароля. Оставляет возможность входа по ключу.
- name: Configure root SSH access (emergency only)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'  # Только по ключу!
    state: present
  notify: Restart SSH

# Запрещает вход по паролю для всех пользователей. Вход только по ключам.
- name: Disable password authentication in SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart SSH

# Включает вход по ключам.
- name: Enable PubkeyAuthentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
  notify: Restart SSH

# Устанавливает Protocol 2 (хотя в современных версиях OpenSSH это уже стандарт)
- name: Ensure SSH Protocol 2
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Protocol'
    line: 'Protocol 2'
    state: present
  notify: Restart SSH

# Настраивает безопасные алгоритмы шифрования
- name: Configure secure ciphers
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Ciphers'
    line: 'Ciphers aes256-ctr,chacha20-poly1305@openssh.com'
    state: present
  notify: Restart SSH

# Настраивает безопасные MAC-алгоритмы
- name: Configure secure MACs
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MACs'
    line: 'MACs hmac-sha2-512,hmac-sha2-256'
    state: present
  notify: Restart SSH

# Настраивает безопасные алгоритмы обмена ключами
- name: Configure secure KexAlgorithms
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KexAlgorithms'
    line: 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org'
    state: present
  notify: Restart SSH

# Настраивает безопасные алгоритмы хостовых ключей
- name: Configure secure HostKeyAlgorithms
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?HostKeyAlgorithms'
    line: 'HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256'
    state: present
  notify: Restart SSH

########################################################################
# Тайм-аут разрыва соединения: 300 сек × 3 = 15 минут тайм-аут.
# ClientAliveInterval (300 сек.) × ClientAliveCountMax (3 сек.) = 900 сек (15 мин.)
# Сервер каждые `ClientAliveInterval` отправляет "пинг" подключённому клиенту, чтобы проверить, что соединение живое.
# Если клиент не отвечает (сеть упала, клиент завис), соединение автоматически разрывается.
# Для очистки "зависших" сессий: Если клиент "завис" (браузер крашнулся, сеть упала), сессия не висит "вечно".
# ClientAliveInterval - период пинга
# ClientAliveCountMax - количество попыток пинга
########################################################################

- name: Configure client alive interval
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveInterval'
    line: 'ClientAliveInterval 300'
    state: present
  notify: Restart SSH

- name: Set client alive count max
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveCountMax'
    line: 'ClientAliveCountMax 3'
    state: present
  notify: Restart SSH

- name: Validate SSH configuration # Выдаст ошибку, если конфиг некорректен
  ansible.builtin.command: sshd -t
  changed_when: false
  failed_when: sshd_test.rc != 0
  register: sshd_test
  notify: Restart SSH






