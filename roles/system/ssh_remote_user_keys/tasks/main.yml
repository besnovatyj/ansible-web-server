---
##
# DEPRECATED (2026-05-15): ключи пользователей теперь раскладывает роль
# `ssh_push_keys` (stage-1b-bootstrap-keys.yml), циклом по server_users.
# Роль больше не подключается, оставлена как история. Можешь удалить каталог
# после проверки нового pipeline.
##
- name: Ensure .ssh directory exists for new user
  file:
    path: "/home/{{ new_user }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ new_user }}"
    group: "{{ new_user }}"

- name: Copy ordinary public key to {{ new_user }}
  authorized_key:
    user: "{{ new_user }}"
    key: "{{ lookup('file', ordinary_pubkey_path) }}"
    state: present
    manage_dir: yes # автоматически создаёт .ssh
