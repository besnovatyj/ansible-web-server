##########################################################
#
# **Цель**: Комплексная проверка всего сервера. ГИБРИД: часть проверок
# enforcing (валят прогон), часть — информативный отчёт.
#
# Stage 6: комплексная проверка сервера
# ENFORCING (падает при провале):
# - SSH: подключение root (аварийный ключ) и каждого server_user (свой ключ)
# - Сервисы active: nginx, php-fpm, mysql, redis, memcached, ufw, fail2ban
# - UFW active, fail2ban sshd jail поднят
# - PHP: критичные модули загружены (Zend OPcache, apcu, redis, pdo_mysql, …)
# REPORT (только вывод, не валит — намеренно):
# - Листинг портов (ss), полный php -m, ufw/fail2ban status
# - HTTP(80)/HTTPS(443) probe
#
# NB: HTTP/HTTPS — `failed_when: false` НАМЕРЕННО: Stage 6 не должен падать на
# отсутствии Certbot (до Stage 5a HTTPS нет, 5xx без серта — нормально).
# Админ читает вывод сам.
#
##########################################################
---
-   name: Stage 6 - Verify SSH access
    hosts: site
    gather_facts: false
    remote_user: "{{ ssh_automation_user }}"
    become: true
    tasks:
      -   name: Verify root SSH login via emergency key
          include_role:
            name: ../roles/system/verify_ssh
          vars:
            verify_ssh_user: root
            verify_ssh_key: "{{ emergency_key_path }}"

      -   name: Verify each server_user SSH login via its own key
          include_role:
            name: ../roles/system/verify_ssh
          vars:
            verify_ssh_user: "{{ su.name }}"
            verify_ssh_key: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ su.name }}"
          loop: "{{ server_users }}"
          loop_control:
            loop_var: su
            label: "{{ su.name }} ({{ su.type }})"

-   name: Stage 6 - Verify services
    hosts: site
    remote_user: "{{ ssh_automation_user }}"
    become: true
    gather_facts: true
    tasks:
      -   name: Check critical services are active
          command: systemctl is-active {{ item }}
          register: svc_status
          changed_when: false
          failed_when: svc_status.stdout != 'active'
          loop:
            - nginx
            - "php{{ php_version }}-fpm"
            - mysql
            - redis-server
            - memcached
            - ufw
            - fail2ban

      -   name: List listening TCP ports
          command: ss -tlnp
          register: listening
          changed_when: false

      -   name: Show listening ports
          debug:
            var: listening.stdout_lines

      -   name: Check PHP modules
          command: "php -m"
          register: php_mods
          changed_when: false

      -   name: Show PHP modules
          debug:
            var: php_mods.stdout_lines

      -   name: Assert critical PHP modules are loaded
          assert:
            that:
              - item in php_mods.stdout
            fail_msg: "PHP-модуль '{{ item }}' не загружен (нет в `php -m`)."
          loop:
            - Zend OPcache
            - apcu
            - redis
            - pdo_mysql
            - mbstring
            - intl

      -   name: Check UFW status
          command: ufw status verbose
          register: ufw_status
          changed_when: false

      -   name: Show UFW status
          debug:
            var: ufw_status.stdout_lines

      -   name: Assert UFW is active
          assert:
            that:
              - "'Status: active' in ufw_status.stdout"
            fail_msg: "UFW не активен."

      -   name: Check fail2ban-client status
          command: fail2ban-client status
          register: f2b_status
          changed_when: false
          failed_when: f2b_status.rc != 0

      -   name: Show fail2ban status
          debug:
            var: f2b_status.stdout_lines

      -   name: Assert fail2ban sshd jail is up
          command: fail2ban-client status sshd
          register: f2b_sshd
          changed_when: false
          failed_when: f2b_sshd.rc != 0

-   name: Stage 6 - HTTP/HTTPS smoke
    hosts: site
    gather_facts: false
    remote_user: "{{ ssh_automation_user }}"
    become: true
    tasks:
      -   name: HTTP probe (80)
          uri:
            url: "http://{{ domain_name }}/"
            status_code: [ 200, 301, 302, 308, 404 ]
            validate_certs: false
            timeout: 10
          register: http_probe
          failed_when: false

      -   name: HTTPS probe (443)
          uri:
            url: "https://{{ domain_name }}/"
            status_code: [ 200, 301, 302, 308, 404 ]
            validate_certs: false
            timeout: 10
          register: https_probe
          failed_when: false

      -   name: Show HTTP/HTTPS probe results
          debug:
            msg:
              - "HTTP {{ http_probe.status | default('FAIL') }}"
              - "HTTPS {{ https_probe.status | default('not configured / FAIL') }}"
