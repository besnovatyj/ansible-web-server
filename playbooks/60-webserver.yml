##########################################################
#
# **Цель**: Установка LEMP-стека.
#
# 60-webserver: LEMP-стек
# 1) Redis **с паролем** (`requirepass`)
# 2) Memcached
# 3) MySQL (install + secure + setup)
# 4) Nginx (3 server block)
# 5) PHP 8.4 + модули + FPM pool
# 6) Composer (для release-роли, 70-release)
# 7) Очистка `apt_clean`
#
##########################################################
---
- name: Pre-flight checks for 60-webserver
  hosts: site
  gather_facts: false
  tasks:
    - name: Assert vault-derived variables
      assert:
        that:
          - vault_mysql_root_password is defined and vault_mysql_root_password | length > 0
          - vault_mysql_db_user_password is defined and vault_mysql_db_user_password | length > 0
          - vault_redis_password is defined and vault_redis_password | length > 0
          - vault_altcha_hmac_key is defined and vault_altcha_hmac_key | length > 0
        fail_msg: |
          Required vault variables are missing.
          Проверьте что group_vars/all/secrets.vault расшифровывается и содержит ключи.

- name: 60-webserver - LEMP stack installation
  hosts: site
  remote_user: "{{ ssh_automation_user }}"
  become: true
  gather_facts: true
  roles:
    - web-server/redis
    - web-server/memcached
    - web-server/mysql
    - web-server/nginx
    - web-server/php
    # Composer из apt — нужен release-роли (70-release: composer install на
    # сервере). ПОСЛЕ php: зависит от php-cli.
    - web-server/composer
    # Секреты приложения в /run/secrets (файловый путь SecretReader, приоритет №1).
    # ПОСЛЕ php: www-data уже существует; значения — те же, что задали redis/mysql.
    - web-server/app_secrets
    # Авто-рестарт критичных сервисов (fire-and-forget): ставится ПОСЛЕ того,
    # как все сервисы установлены — drop-in'ы Restart=on-failure.
    - system/service_restart

- name: 60-webserver - Cleanup
  hosts: site
  remote_user: "{{ ssh_automation_user }}"
  become: true
  roles:
    - system/apt_clean

# Post-conditions: LEMP реально поднят (см. TODO/000-NOTES.MD).
# 443 здесь НЕ проверяем — HTTPS появляется только после 80-certbot.
- name: 60-webserver - Post-checks
  hosts: site
  remote_user: "{{ ssh_automation_user }}"
  become: true
  gather_facts: false
  tasks:
    - name: Assert critical services are active
      command: systemctl is-active {{ item }}
      register: svc_status
      changed_when: false
      failed_when: svc_status.stdout != 'active'
      loop:
        - redis-server
        - memcached
        - mysql
        - nginx
        - "php{{ php_version }}-fpm"
      loop_control:
        label: "{{ item }}"

    - name: Stat PHP-FPM unix socket
      ansible.builtin.stat:
        path: "/run/php/php{{ php_version }}-fpm.sock"
      register: fpm_sock

    - name: Assert PHP-FPM socket exists
      assert:
        that:
          - fpm_sock.stat.exists
        fail_msg: "PHP-FPM socket /run/php/php{{ php_version }}-fpm.sock отсутствует."

    - name: Assert port 80 is listening
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 5
        state: started

    # Роль composer: бинарник реально доступен (нужен release-роли 70-release).
    - name: Assert Composer is available
      ansible.builtin.command: composer --version
      changed_when: false

    # PHP CLI не задушен hardening-ом FPM: composer качает дисты через
    # allow_url_fopen, git-fallback и Process требуют proc_open. Ломается,
    # если security.ini снова попадёт в cli/conf.d (см. роль php).
    - name: Assert PHP CLI is usable for composer (proc_open + allow_url_fopen)
      ansible.builtin.command: >-
        php -r 'exit(function_exists("proc_open") && ini_get("allow_url_fopen") ? 0 : 1);'
      changed_when: false

    # app_secrets: файловые секреты для SecretReader реально на месте и читаемы
    # www-data (под ним php-fpm и queue-воркеры). Пути/имена захардкожены, как и
    # прочие списки в post-checks; источник правды — роль web-server/app_secrets.
    - name: Stat /run/secrets link (без follow — смотрим сам symlink)
      ansible.builtin.stat:
        path: /run/secrets
        follow: false
      register: secrets_link

    - name: Assert /run/secrets is a symlink to the persistent dir
      assert:
        that:
          - secrets_link.stat.exists
          - secrets_link.stat.islnk | default(false)
          - secrets_link.stat.lnk_target == '/etc/bescms/secrets'
        fail_msg: >-
          /run/secrets не symlink на /etc/bescms/secrets (systemd-tmpfiles не
          отработал). SecretReader не найдёт секреты → пустой конфиг БД/Redis.

    - name: Assert each secret file is readable by www-data (php-fpm/queue)
      ansible.builtin.command: test -r /run/secrets/{{ item }}
      become_user: www-data
      changed_when: false
      loop:
        - MYSQL_DATABASE
        - MYSQL_USER
        - MYSQL_PASSWORD
        - REDIS_PASSWORD
        - ALTCHA_HMAC_KEY
        # Хосты приложения (публичны, но раскладываются тем же механизмом):
        - MAIN_HOST
        - ADM_HOST
        - FILES_HOST
      loop_control:
        label: "{{ item }}"

    # service_restart: политика авто-рестарта реально применена к юнитам.
    - name: Get Restart= policy per critical unit
      command: systemctl show -p Restart --value {{ item }}
      register: unit_restart
      changed_when: false
      loop:
        - redis-server
        - memcached
        - mysql
        - nginx
        - "php{{ php_version }}-fpm"
      loop_control:
        label: "{{ item }}"

    - name: Assert auto-restart is enabled on all critical units
      assert:
        that:
          - item.stdout | trim == 'on-failure'
        fail_msg: >-
          {{ item.item }}: Restart={{ item.stdout | trim }} (ожидался on-failure).
          drop-in роли service_restart не применился — проверь daemon-reload.
      loop: "{{ unit_restart.results }}"
      loop_control:
        label: "{{ item.item }}"
