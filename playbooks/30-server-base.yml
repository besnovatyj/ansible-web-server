##########################################################
#
# **Цель**: Базовая настройка ОС. Чистая конфигурация без инструментов безопасности.
#
# 30-server-base: базовая настройка ОС
# 1) Обновление security-патчей
# 2) Локали, hostname, timezone
# 3) Swap
# 4) Лимиты journald
#
# UFW и fail2ban — в 50-server-security, чтобы не мешать первой проверке ключей.
#
# Ключи уже разложены в 20-bootstrap-access, поэтому подключаемся
# automation-пользователем по ключу с эскалацией через sudo (NOPASSWD).
##########################################################
---
- name: Pre-flight checks for 30-server-base
  hosts: site
  gather_facts: false
  tasks:
    - name: Assert essential variables are defined
      assert:
        that:
          - domain_name is defined and domain_name | length > 0
          - host_ip is defined and host_ip | length > 0
        fail_msg: "domain_name or host_ip is missing. Check group_vars/all/main.yml."

- name: 30-server-base - OS base configuration
  hosts: site
  # ИСТОРИЯ (до перехода на automation-user): remote_user: root — `become: true`
  # намеренно убран, root уже даёт нужные права. Теперь Ansible ходит
  # automation-пользователем по ключу, поэтому нужна sudo-эскалация:
  remote_user: "{{ ssh_automation_user }}"
  become: true
  gather_facts: true
  roles:
    - system/apt_update
    - system/locales_hostname_timezone
    - system/swap
    - system/systemd

# Post-conditions: стадия реально достигла цели (см. TODO/000-NOTES.MD).
- name: 30-server-base - Post-checks
  hosts: site
  remote_user: "{{ ssh_automation_user }}"
  become: true
  gather_facts: false
  tasks:
    - name: Get active swap
      command: swapon --show=NAME --noheadings
      register: swap_show
      changed_when: false

    - name: Assert swap is active
      assert:
        that:
          - swap_show.stdout | trim | length > 0
        fail_msg: "Swap не активен (swapon --show пуст). Проверь роль system/swap."

    - name: Get generated locales
      command: locale -a
      register: locale_avail
      changed_when: false

    - name: Get system locale (localectl)
      command: localectl status
      register: localectl_status
      changed_when: false

    # Требование под задачу: ru_RU.UTF-8 СГЕНЕРИРОВАНА (нужна приложению через
    # явный setlocale; Yii2-локализация идёт через intl/ICU, не через LANG ОС),
    # а системный LANG = locale2 (en_US.UTF-8) — консоль на английском.
    # `locale -a` печатает имя как `ru_RU.utf8`, поэтому сверяем по части до точки.
    - name: Assert ru_RU locale generated and system LANG is en_US
      assert:
        that:
          - locale1.split('.')[0] in locale_avail.stdout
          - ('LANG=' ~ locale2) in localectl_status.stdout
        fail_msg: >-
          Ожидалось: локаль {{ locale1 }} сгенерирована (locale -a) и системный
          LANG={{ locale2 }}. locale -a: {{ locale_avail.stdout }}.
          localectl: {{ localectl_status.stdout }}.

    - name: Get configured timezone
      command: timedatectl show -p Timezone --value
      register: tz_value
      changed_when: false

    - name: Assert timezone is correct
      assert:
        that:
          - tz_value.stdout | trim == time_zone
        fail_msg: "Timezone = {{ tz_value.stdout | trim }}, ожидался {{ time_zone }}."
