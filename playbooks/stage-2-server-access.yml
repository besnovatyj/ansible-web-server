##########################################################
#
# **Цель**: Доводка доступа после bootstrap. **Без отключения пароля!**
#
# Stage 2: настройка пользовательского доступа
#   1) Перенаправление SSH-логов в journald
#   2) Verify SSH-входа: root (emergency-ключ) + каждый server_user (свой ключ)
#      через реальный SSH-вход (ключи с passphrase разлочены в ssh-agent
#      ранее командой `make agent-up`).
#   3) Проверка sshd-политики (PubkeyAuthentication, PermitRootLogin,
#      AllowUsers/DenyUsers) — pure-Ansible, без shell.
#
# Создание пользователей и доставка ключей выполнены в stage-1b (bootstrap).
# Подключаемся automation-пользователем по ключу (sudo NOPASSWD).
#
# ВНИМАНИЕ: пароль НЕ отключается, hardening — в Stage 3.
##########################################################
---
- name: Pre-flight checks for stage 2
  hosts: site
  gather_facts: false
  tasks:
    - name: Assert server_users is set
      ansible.builtin.assert:
        that:
          - server_users is defined and server_users | length > 0
        fail_msg: "server_users не задан. Проверь group_vars/all/ssh.yml."

    # ssh-agent должен быть поднят с ключами всех human-юзеров + emergency_root
    # — иначе verify_ssh ниже не пройдёт authentication. automation-юзер
    # коннектится без passphrase в Phase 1 → его в агенте быть не обязано.
    - name: Pre-flight - SSH agent готов и ключи заряжены
      ansible.builtin.include_role:
        name: ../roles/system/ssh_agent_check
      vars:
        ssh_agent_required_pubkeys: >-
          {{ [emergency_pubkey_path] +
             (server_users
              | selectattr('type', 'equalto', 'human')
              | map(attribute='name')
              | map('regex_replace', '^', local_ssh_keys_dir + '/key_' + domain_name + '_')
              | map('regex_replace', '$', '.pub')
              | list) }}

- name: Stage 2 - User access setup
  hosts: site
  remote_user: "{{ ssh_automation_user }}"
  become: true
  gather_facts: true
  roles:
    - ../roles/system/ssh_logs_journald

  post_tasks:
    # Реальный SSH-вход root по emergency-ключу (passphrase разлочен в агенте).
    - name: Verify root login via emergency key
      ansible.builtin.include_role:
        name: ../roles/system/verify_ssh
      vars:
        verify_ssh_user: root
        verify_ssh_key: "{{ emergency_key_path }}"

    # Sshd-политика для root: PermitRootLogin до hardening может быть `yes`
    # или `prohibit-password` → strict=false.
    - name: Verify sshd policy for root (non-strict — pre-hardening)
      ansible.builtin.include_role:
        name: ../roles/system/verify_sshd_policy
      vars:
        verify_target_user: root
        verify_target_is_root: true
        verify_permitroot_strict: false

    - name: Verify each server_user SSH login via own key
      ansible.builtin.include_role:
        name: ../roles/system/verify_ssh
      vars:
        verify_ssh_user: "{{ su.name }}"
        verify_ssh_key: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ su.name }}"
      loop: "{{ server_users }}"
      loop_control:
        loop_var: su
        label: "{{ su.name }} ({{ su.type }})"

    - name: Verify sshd policy per server_user (non-strict — pre-hardening)
      ansible.builtin.include_role:
        name: ../roles/system/verify_sshd_policy
      vars:
        verify_target_user: "{{ su.name }}"
        verify_target_is_root: false
      loop: "{{ server_users }}"
      loop_control:
        loop_var: su
        label: "{{ su.name }} ({{ su.type }})"
