##########################################################
#
# **Цель**: Получить SSL-сертификаты Let's Encrypt и переписать конфиг Nginx на HTTPS.
#           (TLS (после DNS))
#
# 80-certbot: Let's Encrypt сертификаты
# 1) Устанавливает certbot + python3-certbot-nginx
# 2) Получает сертификаты для всех доменов из `nginx_sites[*].server_name`
# 3) Запускает `certbot --nginx --non-interactive --agree-tos -m {{ certbot_email }} -d ...` — Certbot сам редактирует Nginx
# 4) Регистрирует systemd certbot.timer
#
# Запускать после 60-webserver и настройки DNS.
# Предусловия для запуска: 60-webserver успешно прошёл, DNS ВСЕХ доменов из
# nginx_sites (main + www, adm, files) указывает на этот сервер — pre-flight
# ниже проверяет каждый домен через dig сам.
##########################################################
---
-   name: Pre-flight checks for 80-certbot
    hosts: site
    gather_facts: false
    tasks:
      # Certbot выпускает ОДИН сертификат на все server_name из nginx_sites
      # (роль certbot, certbot_domains_args) — незаведённый в DNS поддомен
      # завалит выпуск целиком, поэтому проверяем КАЖДЫЙ домен, а не только
      # {{ domain_name }}. Выражение зеркалит роль — единый источник правды.
      -   name: Resolve every certbot domain (DNS check)
          delegate_to: localhost
          command: dig +short {{ item }}
          register: dns_checks
          changed_when: false
          loop: >-
            {{ nginx_sites | map(attribute='server_name')
                           | map('split', ' ')
                           | flatten | unique | list }}

      # `in stdout_lines`, а не `== stdout`: при CNAME dig +short печатает
      # цепочку (имя цели CNAME + конечный A) в несколько строк — точное
      # сравнение с одной строкой давало бы ложный отказ.
      -   name: Assert each domain resolves to server IP
          assert:
            that:
              - host_ip in item.stdout_lines
            fail_msg: |
              DNS для {{ item.item }} указывает на
              «{{ item.stdout | trim | default('(пусто)', true) }}»,
              а сервер — {{ host_ip }}. Поправь DNS и повтори.
          loop: "{{ dns_checks.results }}"
          loop_control:
            label: "{{ item.item }}"

-   name: 80-certbot - Certbot
    hosts: site
    remote_user: "{{ ssh_automation_user }}"
    become: true
    roles:
      - web-server/certbot

# Post-conditions: сертификат выпущен и certbot не сломал конфиг nginx
# (он редактирует /etc/nginx сам — обязательно перепроверяем). См. TODO/000-NOTES.MD.
-   name: 80-certbot - Post-checks
    hosts: site
    remote_user: "{{ ssh_automation_user }}"
    become: true
    gather_facts: false
    tasks:
      -   name: Stat Let's Encrypt fullchain
          ansible.builtin.stat:
            path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
          register: le_fullchain

      -   name: Assert certificate exists
          assert:
            that:
              - le_fullchain.stat.exists
            fail_msg: >-
              Сертификат /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
              не найден — certbot не выпустил сертификат.

      -   name: Validate nginx config after certbot rewrite
          command: nginx -t
          register: nginx_t
          changed_when: false
          failed_when: nginx_t.rc != 0
