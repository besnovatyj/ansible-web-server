##########################################################
# 90-queue — Yii2 queue workers (systemd)
#
# Запускается ВРУЧНУЮ после того, как сервер настроен И исходники проекта
# уже задеплоены (70-release): должен существовать
# {{ web_root }}/{{ domain_name }}/yii; секреты приложения уже разложены в
# /run/secrets ролью app_secrets (60-webserver) — их читает SecretReader.
# Плейбук полностью настраивает и запускает очереди.
#
# Делает:
# 1) Ставит systemd-шаблон юнита yii-queue@.service
# 2) enable + start воркеров yii-queue@1 .. yii-queue@N
#    (N = queue_workers_count, group_vars/all/webserver.yml)
# 3) Применяет ресурсные лимиты на воркер: MemoryMax / CPUQuota
#    (queue_worker_memory_max / queue_worker_cpu_quota там же)
#
# Воркеры остаются enabled — автозапуск при перезагрузке сервера.
# При повторном прогоне изменённый unit-файл подхватывается рестартом
# (handler Restart yii-queue workers).
##########################################################
---
-   name: 90-queue - Queue workers
    hosts: site
    remote_user: "{{ ssh_automation_user }}"
    become: true
    roles:
      - ../roles/web-server/queue/systemd
