##########################################################
#
# **Цель**: Первичная доставка ключей и создание пользователей.
#           (по паролю root: юзеры + доставка ключей)
#
# 20-bootstrap-access: bootstrap (ЕДИНСТВЕННЫЙ плейбук, ходящий по ПАРОЛЮ root)
#
#   1) Pre-flight (localhost): vault_root_password задан и не пуст;
#      ssh-agent поднят и содержит automation-ключ (нужен для probe + verify).
#   2) Detect: пробуем зайти automation-ключом через агента. Если уже можем —
#      bootstrap не нужен (повторный/идемпотентный прогон).
#   3) Bootstrap по паролю root (только если нужно):
#      - users_provision: создаёт всех server_users (+ sudo, + пароли);
#      - ssh_push_keys:  раскладывает публичные ключи (+ emergency root).
#   4) Verify: automation-вход по ключу работает (через ssh-agent).
#
# После этого парольный доступ Ansible больше НЕ нужен — все остальные
# плейбуки ходят automation-пользователем по ключу (см. inventory/hosts.yml),
# passphrase разлочен в ssh-agent один раз через `make agent-up`.
#
# Запускать ПЕРВЫМ среди remote-плейбуков (сразу после 10-local-init).
# Требует `sshpass` на контроллере (парольная аутентификация SSH).
##########################################################
---
- name: Pre-flight checks for 20-bootstrap-access
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert vault_root_password is defined and non-empty
      assert:
        that:
          - vault_root_password is defined
          - vault_root_password | length > 0
        fail_msg: >-
          vault_root_password не задан — bootstrap по паролю невозможен.
          Заполни secrets/secrets.yml и зашифруй в group_vars/all/secrets.vault.

    - name: Assert ssh_automation_user is present in server_users with type automation
      assert:
        that:
          - server_users | selectattr('name', 'equalto', ssh_automation_user)
              | selectattr('type', 'equalto', 'automation') | list | length == 1
        fail_msg: >-
          ssh_automation_user ({{ ssh_automation_user }}) должен присутствовать
          в server_users ровно один раз с type: automation.

- name: Detect connectivity mode
  hosts: site
  gather_facts: false
  pre_tasks:
    # Pre-flight: ssh-agent должен быть поднят с automation-ключом — иначе
    # probe ниже всегда вернёт rc!=0 и Ansible полезет в bootstrap, после чего
    # упадёт finальный verify_ssh. Списком только automation: bes и emergency
    # понадобятся в 40-server-access и далее, проверим там.
    - name: Pre-flight - SSH agent готов и automation-ключ заряжен
      ansible.builtin.include_role:
        name: system/ssh_agent_check
      vars:
        ssh_agent_required_pubkeys:
          - "{{ automation_key_path }}.pub"

  tasks:
    - name: Probe key-based login as automation user
      delegate_to: localhost
      # SSH_AUTH_SOCK явно прокидываем (subprocess унаследовал бы и так — но
      # пусть зависимость от агента видна в коде). IdentitiesOnly=yes — клиент
      # предлагает ТОЛЬКО наш -i, агент даёт подпись (passphrase разлочен
      # `make agent-up`).
      environment:
        SSH_AUTH_SOCK: "{{ lookup('env', 'SSH_AUTH_SOCK') }}"
      command: >-
        ssh -i {{ automation_key_path }}
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=8
            -o StrictHostKeyChecking=accept-new
            -p {{ target_ssh_port }}
            {{ ssh_automation_user }}@{{ ansible_host }} true
      register: key_probe
      failed_when: false
      changed_when: false

    - name: Decide whether bootstrap is needed
      set_fact:
        bootstrap_needed: "{{ key_probe.rc != 0 }}"

    - name: Report detected mode
      debug:
        msg: >-
          {{ 'Automation-ключ НЕ работает → выполняю bootstrap по паролю root.'
             if bootstrap_needed
             else 'Automation-ключ уже работает → bootstrap пропущен (идемпотентно).' }}

- name: Bootstrap users & keys over root password
  hosts: site
  gather_facts: false
  # Парольное подключение root изолировано здесь (НЕ в инвентаре).
  vars:
    ansible_user: root
    ansible_ssh_pass: "{{ vault_root_password }}"
    ansible_ssh_private_key_file: ""
    ansible_ssh_common_args: >-
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no
      -o StrictHostKeyChecking=accept-new
  tasks:
    - name: Bootstrap (skipped when automation key already works)
      when: bootstrap_needed | default(true)
      block:
        - name: Gather minimal facts (datetime etc.)
          ansible.builtin.setup:
            gather_subset:
              - min

        - name: Provision all server_users
          include_role:
            name: system/users_provision

        - name: Push public keys (+ emergency root)
          include_role:
            name: system/ssh_push_keys

- name: Verify automation key works after bootstrap
  hosts: site
  gather_facts: false
  tasks:
    - name: Verify automation user SSH login via its key
      include_role:
        name: system/verify_ssh
      vars:
        verify_ssh_user: "{{ ssh_automation_user }}"
        verify_ssh_key: "{{ automation_key_path }}"
