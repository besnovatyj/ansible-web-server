##########################################################
#
# **Цель**: Подготовить локальную машину для работы с сервером.
#
# 10-local-init: локальная инициализация
# 1) Pre-flight: проверка что inventory загружен
# 2) Генерация SSH-ключей (server_users + emergency root) в ~/.ssh/<домен>/
#    (local_ssh_keys_dir из group_vars/all/ssh.yml; ранее было secrets/ssh/ —
#    переехали из-за прав на drvfs bind-mount)
# 3) Добавление отпечатка сервера в ~/.ssh/known_hosts
##########################################################
---
- name: Pre-flight checks for 10-local-init
  hosts: localhost
  gather_facts: false # для localhost — не нужны
  tasks:
    - name: Assert site group is non-empty in inventory
      assert:
        that:
          - groups['site'] is defined
          - groups['site'] | length > 0
        fail_msg: "Inventory file does not define group 'site'. Запустите с -i inventory/hosts.yml"

    - name: Assert vault_root_password is set (нужен для 20-bootstrap-access)
      assert:
        that:
          - vault_root_password is defined
          - vault_root_password | length > 0
        fail_msg: >-
          vault_root_password не определён — без него 20-bootstrap-access не
          доставит ключи по паролю root. Заполни secrets/secrets.yml и зашифруй
          значения в group_vars/all/secrets.vault (см. vault.yml).

    - name: Assert ssh_automation_user is valid in server_users
      assert:
        that:
          - server_users | selectattr('name', 'equalto', ssh_automation_user)
              | selectattr('type', 'equalto', 'automation') | list | length == 1
        fail_msg: >-
          ssh_automation_user ({{ ssh_automation_user }}) должен быть в server_users
          ровно один раз с type: automation. Проверь group_vars/all/ssh.yml.

- name: Generate SSH keys and trust remote host
  hosts: localhost
  gather_facts: false
  roles:
    - system/ssh_generate_local_keys
    - system/ssh_add_remote_host_to_known_hosts

# Post-conditions: ключи реально созданы с правильными правами (см. TODO/000-NOTES.MD).
# Приватный — 0600, публичный — 0644. Проверяются ключи всех server_users
# (включая automation) + аварийная пара root.
- name: 10-local-init - Post-checks (keys exist with correct perms)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build expected key path list (path + ожидаемый mode)
      set_fact:
        ssh_key_specs: >-
          {{ ssh_key_specs | default([])
             + [ {'path': base, 'mode': '0600'},
                 {'path': base ~ '.pub', 'mode': '0644'} ] }}
      loop: "{{ server_users }}"
      loop_control:
        loop_var: su
        label: "{{ su.name }}"
      vars:
        base: "{{ local_ssh_keys_dir }}/key_{{ domain_name }}_{{ su.name }}"

    - name: Add emergency root key pair to the list
      set_fact:
        ssh_key_specs: >-
          {{ ssh_key_specs
             + [ {'path': emergency_key_path,    'mode': '0600'},
                 {'path': emergency_pubkey_path, 'mode': '0644'} ] }}

    - name: Stat each expected key file
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ ssh_key_specs }}"
      loop_control:
        label: "{{ item.path }}"
      register: key_stats

    - name: Assert each key exists with correct permissions
      assert:
        that:
          - item.stat.exists
          - item.stat.mode == item.item.mode
        fail_msg: >-
          {{ item.item.path }}: exists={{ item.stat.exists }},
          mode={{ item.stat.mode | default('N/A') }},
          ожидался {{ item.item.mode }}.
      loop: "{{ key_stats.results }}"
      loop_control:
        label: "{{ item.item.path }}"
