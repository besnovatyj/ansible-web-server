; файл ansible.cfg (ищется в порядке: ENV ANSIBLE_CONFIG, текущая директория, ~/.ansible.cfg, /etc/ansible/ansible.cfg).

[defaults]
roles_path = ./roles/ ; Папка с ролями. Плейбуки ссылаются короткими именами (system/..., web-server/...); путь относителен CWD — запускать из корня проекта (make/$(PLAY) это гарантируют)
inventory = ./inventory/ ; Путь к inventory-файлам
log_path = ./logs/ansible.log ; логи
vault_password_file = ./secrets/!vault_pass.txt ; Пароль к Ansible Vault
;become = yes
;retry_files_enabled = False ; Отключаем retry-файлы в случае неудачного выполнения таска
;private_key_file = /mnt/usb/ssh_keys/id_bes-dev.ru ; Можно указать нестандартную директорию с ssh ключами

[ssh_connection]
; SSH multiplexing (ControlMaster/ControlPersist) ОТКЛЮЧЁН СОЗНАТЕЛЬНО.
; Причина: баг Ansible #79992 — после reboot модуль `reboot` зацикливается на
; мёртвом persistent-мастере и не переподключается; каждый ретрай сбрасывает
; idle-таймер ControlPersist, поэтому сокет не протухает сам → таск висит до
; reboot_timeout (наблюдалось: сервер поднялся за ~6 c, а reboot-таск висел >12 мин).
; Снижение ControlPersist не лечит (ретраи держат сокет «тёплым»). Надёжность
; важнее микро-экономии на переиспользовании TCP, тем более что overhead новых
; соединений компенсирует включённый ниже `pipelining = True` (модуль — один
; SSH-вызов). ControlPath=none — на случай ControlPath в личном ~/.ssh/config.
; `ControlMaster=no` — каждая задача открывает свежее SSH-соединение, без сокета.
;
; `IdentitiesOnly=yes` — критично для совместной работы Ansible и ssh-agent
; (`make agent-up`). Без него клиент сначала предлагает серверу ВСЕ ключи из
; агента, упирается в серверный MaxAuthTries (default=6) и до нашего
; `ansible_ssh_private_key_file` может не дойти → Permission denied. С
; IdentitiesOnly=yes клиент предлагает только указанный `-i KEY`; если этот
; ключ заряжен в агенте (Phase 2 для automation), агент даёт подпись — иначе
; читает приватник из файла напрямую (Phase 1 для automation, без passphrase).
ssh_args = -o ControlMaster=no -o ControlPath=none -o ConnectTimeout=30 -o IdentitiesOnly=yes
ask_pass = False ; Пароль берётся из inventory, а не запрашивается
; pipelining=True — выполнять модуль одним SSH-вызовом (без отдельной заливки во
; временный файл). Меньше SSH-операций → заметное ускорение и, главное, штатная
; работа под automation-ключом с опцией `restrict` (no-pty): убирает потребность
; в `-tt`. Требование: в sudoers НЕТ `Defaults requiretty` (Ubuntu 24.04 — по
; умолчанию не задан; automation-пользователь идёт через NOPASSWD drop-in).
pipelining = True
; use_tty=False — не добавлять `-tt` (форс pty) при become. Сервер с `restrict`
; pty не выдаёт, поэтому форс лишь засоряет stderr строкой
; `PTY allocation request failed on channel 0`. Безопасно при sudo NOPASSWD.
use_tty = False
